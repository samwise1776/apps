# Datacenter permission registry format 1
#
# Unknown applications default to Level 0. Keep this file writable only by the
# trusted Datacenter security authority. Application names are not identities;
# the launcher must authenticate a process before passing its ID to Checker.
format.version=1

# Example registration (disabled by default):
# app.example.status=ACTIVE
# app.example.level=2
# app.example.scopes=data/example;apps/example
# app.example.capabilities=
# app.example.deny=FILE_WRITE,FILE_DELETE

# Datadocs remains pending until its file operations are connected to Checker.
# Its intended scope is its private data directory, not unrestricted Level 4.
app.datadocs.status=PENDING
app.datadocs.level=0
app.datadocs.scopes=data/datadocs
app.datadocs.capabilities=
app.datadocs.deny=
