<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HabitForge - Habit Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#23225A;color:#F0F0F5;font-family:'Segoe UI',sans-serif;min-height:100vh}
a.back{position:fixed;top:12px;left:12px;color:#FFCB47;text-decoration:none;font-size:14px;z-index:100;background:rgba(35,34,90,.9);padding:4px 10px;border-radius:6px}
a.back:hover{text-decoration:underline}
.container{max-width:1000px;margin:0 auto;padding:50px 20px 20px}
h1{color:#FFCB47;font-size:28px;margin-bottom:16px}
h2{color:#FFCB47;font-size:18px;margin-bottom:10px}
h3{color:#F0F0F5;font-size:15px;margin-bottom:8px}
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#2E2F5E;border:1px solid #4449E2;border-radius:10px;padding:14px;text-align:center}
.stat .val{font-size:24px;font-weight:700;color:#FFCB47}
.stat .lbl{font-size:12px;color:#8888bb;margin-top:4px}
.panel{background:#2E2F5E;border:1px solid #4449E2;border-radius:10px;padding:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
input,select{background:#23225A;color:#F0F0F5;border:1px solid #4449E2;border-radius:6px;padding:8px 12px;font-size:14px;width:100%;margin-bottom:8px}
.btn{background:#4449E2;color:#F0F0F5;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{background:#5555FF}
.btn.danger{background:#e74c3c}
.btn.secondary{background:transparent;border:1px solid #4449E2}
.btn.sm{padding:4px 10px;font-size:12px}
.habit-card{background:#23225A;border:1px solid #4449E2;border-radius:8px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.habit-card .color-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.habit-card .info{flex:1}
.habit-card .name{font-weight:600;margin-bottom:2px}
.habit-card .meta{font-size:12px;color:#8888bb}
.habit-card .actions{display:flex;gap:6px;align-items:center}
.check-btn{width:36px;height:36px;border-radius:50%;border:2px solid #4449E2;background:transparent;color:#4449E2;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.check-btn:hover{background:#4449E2;color:#F0F0F5}
.check-btn.checked{background:#2ecc71;border-color:#2ecc71;color:#fff}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{text-align:center;padding:6px 2px;border-radius:4px;font-size:11px;background:#23225A;border:1px solid #353670}
.cal-day.done{border-color:#2ecc71;background:rgba(46,204,113,.2)}
.cal-day.today{border-color:#FFCB47}
.cal-header{text-align:center;font-size:10px;color:#8888bb;padding:4px 0}
.habit-select{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.habit-chip{padding:4px 10px;border-radius:12px;font-size:11px;cursor:pointer;border:1px solid #4449E2;background:transparent;color:#8888bb}
.habit-chip.active{background:#4449E2;color:#F0F0F5}
.hidden{display:none}
.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100}
.confirm-box{background:#2E2F5E;border:1px solid #4449E2;border-radius:10px;padding:24px;text-align:center;max-width:320px}
.confirm-box p{margin-bottom:16px}
</style>
</head>
<body>
<a href="../" class="back">&larr; Back</a>
<div class="container">
<h1>HabitForge</h1>
<div class="stats-bar" id="stats"></div>
<div class="panel">
<h3>Add Habit</h3>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<input id="hName" placeholder="Habit name" style="flex:2">
<select id="hFreq" style="flex:1"><option value="daily">Daily</option><option value="weekly">Weekly</option></select>
<input id="hCat" placeholder="Category" style="flex:1">
<input id="hColor" type="color" value="#4449E2" style="flex:0;width:50px;margin-bottom:8px">
<button class="btn" onclick="addHabit()">Add</button>
</div>
</div>
<div class="grid2">
<div class="panel">
<h3>Habits</h3>
<div id="habitList"></div>
</div>
<div class="panel">
<h3>Calendar</h3>
<div class="habit-select" id="calSelect"></div>
<div class="calendar" id="calendar"></div>
</div>
</div>
<div class="panel">
<h3>Statistics</h3>
<div id="statistics"></div>
</div>
<div class="panel" style="display:flex;gap:8px">
<button class="btn secondary" onclick="exportData()">Export JSON</button>
<button class="btn secondary" onclick="document.getElementById('importFile').click()">Import JSON</button>
<input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
</div>
</div>
<script>
const DB='hf_data';
let habits=[];
let calHabitId=null;
const DAYS=['Su','Mo','Tu','We','Th','Fr','Sa'];

function loadData(){try{const d=JSON.parse(localStorage.getItem(DB));if(d)habits=d.habits||[];}catch(e){}}
function saveData(){localStorage.setItem(DB,JSON.stringify({habits}))}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function today(){return new Date().toISOString().slice(0,10)}

function addHabit(){
    const name=document.getElementById('hName').value.trim();
    if(!name)return;
    habits.push({
        id:Date.now(),name,
        freq:document.getElementById('hFreq').value,
        category:document.getElementById('hCat').value||'General',
        color:document.getElementById('hColor').value,
        checkins:[]
    });
    document.getElementById('hName').value='';document.getElementById('hCat').value='';
    saveData();render();
}

function deleteHabit(id){
    const overlay=document.createElement('div');
    overlay.className='confirm-overlay';
    overlay.innerHTML='<div class="confirm-box"><p>Delete this habit?</p><div style="display:flex;gap:8px;justify-content:center"><button class="btn danger" id="confYes">Delete</button><button class="btn secondary" id="confNo">Cancel</button></div></div>';
    document.body.appendChild(overlay);
    document.getElementById('confYes').onclick=()=>{habits=habits.filter(h=>h.id!==id);saveData();render();overlay.remove()};
    document.getElementById('confNo').onclick=()=>overlay.remove();
}

function toggleCheckin(habitId){
    const h=habits.find(x=>x.id===habitId);if(!h)return;
    const t=today();
    if(h.checkins.includes(t))h.checkins=h.checkins.filter(d=>d!==t);
    else h.checkins.push(t);
    saveData();render();
}

function getStreak(h){
    let streak=0;const t=new Date();
    for(let i=0;i<365;i++){
        const d=new Date(t);d.setDate(d.getDate()-i);
        const ds=d.toISOString().slice(0,10);
        if(h.checkins.includes(ds))streak++;
        else if(i>0)break;
    }
    return streak;
}

function getLongestStreak(h){
    if(!h.checkins.length)return 0;
    const sorted=[...h.checkins].sort();
    let longest=1,current=1;
    for(let i=1;i<sorted.length;i++){
        const prev=new Date(sorted[i-1]);const curr=new Date(sorted[i]);
        if((curr-prev)/(86400000)===1)current++;
        else current=1;
        if(current>longest)longest=current;
    }
    return longest;
}

function getCompletionRate(h){
    if(!h.checkins.length)return 0;
    const first=new Date(h.checkins.sort()[0]);
    const days=Math.max(1,Math.ceil((new Date()-first)/86400000));
    return Math.min(100,Math.round(h.checkins.length/days*100));
}

function render(){
    const totalCheckins=habits.reduce((s,h)=>s+h.checkins.length,0);
    const bestHabit=habits.length?habits.reduce((best,h)=>getStreak(h)>getStreak(best)?h:best):null;
    const avgCompletion=habits.length?Math.round(habits.reduce((s,h)=>s+getCompletionRate(h),0)/habits.length):0;

    document.getElementById('stats').innerHTML=
        '<div class="stat"><div class="val">'+habits.length+'</div><div class="lbl">Habits</div></div>'+
        '<div class="stat"><div class="val">'+totalCheckins+'</div><div class="lbl">Total Check-ins</div></div>'+
        '<div class="stat"><div class="val">'+(bestHabit?getStreak(bestHabit):0)+'</div><div class="lbl">Best Streak</div></div>'+
        '<div class="stat"><div class="val">'+avgCompletion+'%</div><div class="lbl">Avg Completion</div></div>';

    document.getElementById('habitList').innerHTML=habits.map(h=>{
        const streak=getStreak(h);const rate=getCompletionRate(h);const checked=h.checkins.includes(today());
        return '<div class="habit-card"><div class="color-dot" style="background:'+h.color+'"></div>'+
        '<div class="info"><div class="name">'+esc(h.name)+'</div>'+
        '<div class="meta">'+h.category+' &middot; '+h.freq+' &middot; Streak: '+streak+' &middot; Rate: '+rate+'%</div></div>'+
        '<div class="actions"><button class="check-btn'+(checked?' checked':'')+'" onclick="toggleCheckin('+h.id+')">✓</button>'+
        '<button onclick="deleteHabit('+h.id+')" style="background:none;border:none;color:#e74c3c;cursor:pointer;font-size:16px">✕</button></div></div>';
    }).join('')||'<p style="color:#8888bb">No habits yet</p>';

    document.getElementById('calSelect').innerHTML=habits.map(h=>
        '<div class="habit-chip'+(calHabitId===h.id?' active':'')+'" onclick="calHabitId='+h.id+';render()" style="'+(calHabitId===h.id?'background:'+h.color+';border-color:'+h.color:'')+'">'+esc(h.name)+'</div>'
    ).join('');

    const calH=habits.find(h=>h.id===calHabitId);
    const now=new Date();
    let calHtml='';
    DAYS.forEach(d=>{calHtml+='<div class="cal-header">'+d+'</div>'});
    for(let i=29;i>=0;i--){
        const d=new Date(now);d.setDate(d.getDate()-i);
        const ds=d.toISOString().slice(0,10);
        const isToday=ds===today();
        const done=calH?calH.checkins.includes(ds):false;
        calHtml+='<div class="cal-day'+(done?' done':'')+(isToday?' today':'')+'">'+d.getDate()+'</div>';
    }
    document.getElementById('calendar').innerHTML=calHtml;

    document.getElementById('statistics').innerHTML=habits.length?
        '<table style="width:100%;font-size:13px"><thead><tr><th>Habit</th><th>Check-ins</th><th>Streak</th><th>Longest</th><th>Rate</th></tr></thead><tbody>'+
        habits.map(h=>'<tr><td><span style="color:'+h.color+'">●</span> '+esc(h.name)+'</td><td>'+h.checkins.length+'</td><td>'+getStreak(h)+'</td><td>'+getLongestStreak(h)+'</td><td>'+getCompletionRate(h)+'%</td></tr>').join('')+
        '</tbody></table>':'<p style="color:#8888bb;font-size:13px">No data yet</p>';
}

function exportData(){
    const blob=new Blob([JSON.stringify({habits},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='habitforge.json';a.click();
}

function importData(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.habits)habits=d.habits;saveData();render();}catch(e){alert('Invalid JSON');}};
    reader.readAsText(file);
}

loadData();calHabitId=habits[0]?.id||null;render();
</script>
</body>
</html>
