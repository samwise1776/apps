<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova - AI Chat Assistant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#302F6E;color:#F0F0F5;font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
a.back{position:fixed;top:12px;left:12px;z-index:1000;color:#FFCB47;text-decoration:none;font-size:13px;background:rgba(46,47,94,.85);padding:4px 10px;border-radius:6px}
a.back:hover{background:rgba(68,73,226,.6)}
.header{padding:16px 20px;display:flex;align-items:center;gap:14px;background:#2E2F5E;border-bottom:2px solid #4449E2}
.avatar-nova{width:42px;height:42px;border-radius:50%;background:#4449E2;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;color:#FFCB47}
.header h1{font-size:20px;color:#FFCB47}
.header span{font-size:12px;color:#888}
.header .clear-btn{margin-left:auto;padding:6px 14px;border:none;border-radius:6px;background:#e24444;color:#fff;cursor:pointer;font-size:12px}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;max-width:80%;animation:fadeIn .2s}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.assistant{align-self:flex-start}
.avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold}
.msg.user .avatar{background:#4449E2;color:#F0F0F5}
.msg.assistant .avatar{background:#FFCB47;color:#23225A}
.bubble{padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:#4449E2;border-bottom-right-radius:4px}
.msg.assistant .bubble{background:#2E2F5E;border-bottom-left-radius:4px}
.typing{display:flex;gap:4px;padding:14px 18px;background:#2E2F5E;border-radius:16px;width:fit-content}
.typing span{width:8px;height:8px;border-radius:50%;background:#FFCB47;animation:bounce .6s infinite alternate}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{opacity:.3;transform:translateY(-4px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.input-bar{display:flex;gap:10px;padding:16px 20px;background:#2E2F5E;border-top:2px solid #4449E2}
.input-bar input{flex:1;padding:12px 16px;border:none;border-radius:24px;background:#302F6E;color:#F0F0F5;font-size:14px;outline:none}
.input-bar input::placeholder{color:#666}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:#4449E2;color:#F0F0F5;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.send-btn:hover{background:#5a5ff0}
</style>
</head>
<body>
<a class="back" href="../">&larr; Back</a>
<div class="header">
  <div class="avatar-nova">N</div>
  <div><h1>Nova</h1><span>Offline AI Assistant</span></div>
  <button class="clear-btn" id="clearChat">Clear Chat</button>
</div>
<div class="chat" id="chat"></div>
<div class="input-bar">
  <input type="text" id="userInput" placeholder="Ask me anything..." autocomplete="off">
  <button class="send-btn" id="sendBtn">&#9658;</button>
</div>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('userInput');
let history=JSON.parse(localStorage.getItem('nova_chat')||'[]');

const jokes=[
  "Why do programmers prefer dark mode? Because light attracts bugs!",
  "Why was the JavaScript developer sad? Because he didn't Node how to Express himself.",
  "What's a programmer's favorite hangout place? Foo Bar.",
  "Why do Java developers wear glasses? Because they can't C#.",
  "How many programmers does it take to change a light bulb? None, that's a hardware problem.",
  "Why do programmers hate nature? It has too many bugs.",
  "What's a computer's favorite snack? Microchips!",
  "Why did the developer go broke? Because he used up all his cache.",
  "What do you call a computer that sings? A-Dell.",
  "Why was the computer cold? It left its Windows open!",
  "Why did the programmer quit his job? Because he didn't get arrays.",
  "What do computers eat for snacks? Microchips and byte-size candy.",
  "Why do programmers always mix up Halloween and Christmas? Because Oct 31 = Dec 25.",
  "What's the object-oriented way to become wealthy? Inheritance.",
  "Why did the coder get stuck in the shower? The instructions said 'lather, rinse, repeat'.",
  "What do you call 5 members of a boy band? A local area network.",
  "Why was the math book sad? It had too many problems.",
  "What's a robot's favorite type of music? Heavy metal.",
  "Why did the computer go to the doctor? Because it had a virus!",
  "How does a computer get drunk? It takes screenshots.",
  "What do you call a computer floating in the ocean? A Dell floating in the water.",
  "Why did the developer get confused at the library? Because the functions kept returning different books."
];

const facts=[
  "Octopuses have three hearts and blue blood.",
  "Honey never spoils. Archaeologists found 3000-year-old honey in Egyptian tombs that was still edible.",
  "A group of flamingos is called a 'flamboyance'.",
  "Bananas are berries, but strawberries are not.",
  "The inventor of the Pringles can is buried in one.",
  "A jiffy is an actual unit of time: 1/100th of a second.",
  "Cows have best friends and get stressed when separated.",
  "The shortest war in history lasted 38 to 45 minutes (Anglo-Zanzibar War).",
  "A teaspoonful of neutron star weighs about 6 billion tons.",
  "Venus is the only planet that spins clockwise.",
  "The human brain can survive for 5 to 10 minutes without oxygen.",
  "Wombat poop is cube-shaped.",
  "There are more possible iterations of a game of chess than atoms in the known universe.",
  "The inventor of the fire hydrant is unknown because the patent was lost in a fire.",
  "A bolt of lightning is five times hotter than the sun's surface.",
  "Cats spend 30-50% of their day grooming themselves.",
  "The unicorn is Scotland's national animal.",
  "Cleopatra lived closer in time to the Moon landing than to the building of the Great Pyramids.",
  "Turtles can breathe through their butts.",
  "The dot over the letters i and j is called a tittle.",
  "Butterflies taste with their feet.",
  "The entire world's population could fit inside Los Angeles."
];

function getResponse(msg){
  const m=msg.toLowerCase().trim();
  if(/^(hi|hello|hey|howdy|hola|sup|yo|greetings)\b/.test(m))return "Hey there! 👋 I'm Nova, your offline assistant. How can I help you today?";
  if(/\b(what time|current time|time is it|what's the time)\b/.test(m))return "🕐 It's currently "+new Date().toLocaleTimeString()+".";
  if(/\b(what day|what date|today's date|current date|what's the date|day is it)\b/.test(m))return "📅 Today is "+new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+".";
  if(/\b(joke|funny|laugh|humor)\b/.test(m))return jokes[Math.floor(Math.random()*jokes.length)];
  if(/\b(fact|interesting|random fact|trivia)\b/.test(m))return "💡 Fun fact: "+facts[Math.floor(Math.random()*facts.length)];
  if(/\b(help|what can you do|capabilities)\b/.test(m))return "Here's what I can do:\n• Tell the time & date\n• Evaluate math expressions (try: 2+2, 5*3)\n• Tell jokes 😄\n• Share fun facts 🧠\n• Chat about the weather\n• ...and more!";
  if(/\b(weather|temperature|forecast)\b/.test(m))return "🌤 I'm offline, but I'm sure it's nice outside! Try checking your local weather app.";
  if(/\b(your name|who are you|what are you)\b/.test(m))return "I'm Nova, your offline assistant! 🤖 I run entirely in your browser with no internet needed.";
  if(/\b(thank|thanks|thx|ty)\b/.test(m))return "You're welcome! 😊 Is there anything else I can help with?";
  if(/\b(color|favourite color|favorite color|like)\b/.test(m))return "I like #FFCB47 — the warm golden Datacenter accent! ✨";
  if(/\b(love|like you|you're cool|awesome)\b/.test(m))return "Aww, thanks! That means a lot coming from you! 💛";
  if(/\b(bye|goodbye|see ya|later)\b/.test(m))return "Goodbye! Have a great day! 👋";
  if(/^\d+[\+\-\*\/\%\.\(\)\s]+$/.test(m)){
    try{const r=Function('"use strict";return ('+m+')')();return "🧮 The answer is: "+r;}
    catch(e){return "Hmm, I couldn't evaluate that math expression. Try something like 2+2 or 5*3.";}
  }
  return "I'm not sure about that. Try asking about math, jokes, facts, or the time! 😊";
}

function renderHistory(){
  chat.innerHTML='';
  history.forEach(h=>{
    addMessage(h.role,h.text,false);
  });
  chat.scrollTop=chat.scrollHeight;
}

function addMessage(role,text,anim=true){
  const d=document.createElement('div');
  d.className='msg '+role;
  if(anim)d.style.animation='fadeIn .2s';
  const avatarLabel=role==='user'?'U':'N';
  d.innerHTML=`<div class="avatar">${avatarLabel}</div><div class="bubble">${escapeHtml(text)}</div>`;
  chat.appendChild(d);
}

function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function showTyping(){
  const d=document.createElement('div');
  d.className='msg assistant';d.id='typing';
  d.innerHTML=`<div class="avatar">N</div><div class="typing"><span></span><span></span><span></span></div>`;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}
function hideTyping(){const t=document.getElementById('typing');if(t)t.remove();}

function send(){
  const text=input.value.trim();
  if(!text)return;
  input.value='';
  history.push({role:'user',text});
  addMessage('user',text);
  chat.scrollTop=chat.scrollHeight;
  showTyping();
  setTimeout(()=>{
    hideTyping();
    const resp=getResponse(text);
    history.push({role:'assistant',text:resp});
    addMessage('assistant',resp);
    chat.scrollTop=chat.scrollHeight;
    localStorage.setItem('nova_chat',JSON.stringify(history));
  },800);
}

document.getElementById('sendBtn').addEventListener('click',send);
input.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
document.getElementById('clearChat').addEventListener('click',()=>{history=[];localStorage.removeItem('nova_chat');chat.innerHTML='';});

renderHistory();
if(!history.length){
  setTimeout(()=>{
    history.push({role:'assistant',text:"Hi! I'm Nova, your offline AI assistant! 🤖\n\nAsk me about math, the time, jokes, fun facts, or just say hi!"});
    addMessage('assistant',history[0].text);
    chat.scrollTop=chat.scrollHeight;
    localStorage.setItem('nova_chat',JSON.stringify(history));
  },500);
}
</script>
</body>
</html>
