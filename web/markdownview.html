<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarkdownView - Markdown Renderer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#23225A;color:#F0F0F5;height:100vh;display:flex;flex-direction:column}
a.back{position:fixed;top:12px;left:12px;color:#FFCB47;text-decoration:none;font-size:14px;opacity:.8;z-index:10}
a.back:hover{opacity:1}
.toolbar{display:flex;gap:8px;padding:10px 20px;background:#2E2F6E;align-items:center;flex-wrap:wrap}
.toolbar h1{font-size:18px;color:#FFCB47;margin-right:12px}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;background:#4449E2;color:#F0F0F5}
.btn:hover{background:#5559F2}
.btn-accent{background:#FFCB47;color:#23225A}
.stats{margin-left:auto;font-size:12px;color:rgba(240,240,245,.6)}
.main{display:flex;flex:1;overflow:hidden}
.editor{flex:1;display:flex;flex-direction:column;border-right:1px solid #2E2F6E}
.editor textarea{flex:1;width:100%;padding:20px;background:#1a1a4a;color:#F0F0F5;border:none;resize:none;font-family:'Fira Code',monospace;font-size:14px;line-height:1.6}
.editor textarea:focus{outline:none}
.preview{flex:1;overflow-y:auto;padding:20px;background:#1e1e50}
.preview h1,.preview h2,.preview h3,.preview h4,.preview h5,.preview h6{color:#FFCB47;margin:16px 0 8px}
.preview h1{font-size:28px;border-bottom:2px solid #4449E2;padding-bottom:8px}
.preview h2{font-size:22px;border-bottom:1px solid #2E2F6E;padding-bottom:6px}
.preview p{margin:8px 0;line-height:1.6}
.preview code{background:#2E2F6E;padding:2px 6px;border-radius:4px;font-family:'Fira Code',monospace;font-size:13px}
.preview pre{background:#1a1a4a;padding:16px;border-radius:8px;overflow-x:auto;margin:12px 0;border:1px solid #2E2F6E}
.preview pre code{background:none;padding:0}
.preview blockquote{border-left:4px solid #4449E2;padding:8px 16px;margin:12px 0;background:rgba(68,73,226,.1);border-radius:0 8px 8px 0}
.preview a{color:#4449E2;text-decoration:underline}
.preview img{max-width:100%;border-radius:8px}
.preview table{border-collapse:collapse;width:100%;margin:12px 0}
.preview th,.preview td{border:1px solid #2E2F6E;padding:8px 12px;text-align:left}
.preview th{background:#2E2F6E;color:#FFCB47}
.preview hr{border:none;border-top:2px solid #2E2F6E;margin:16px 0}
.preview ul,.preview ol{padding-left:24px;margin:8px 0}
.preview li{margin:4px 0}
.preview del{color:rgba(240,240,245,.5)}
.preview .task-list{list-style:none;padding-left:0}
.preview .task-list input{margin-right:8px}
.fullscreen .editor{display:none}
.fullscreen .preview{flex:1}
.preview-header{padding:8px 20px;background:#2E2F6E;font-size:13px;color:rgba(240,240,245,.6);border-bottom:1px solid rgba(240,240,245,.1)}
</style>
</head>
<body>
<a href="../" class="back">&larr; Back</a>
<div class="toolbar">
<h1>📝 MarkdownView</h1>
<button class="btn" onclick="exportHTML()">Export HTML</button>
<button class="btn" onclick="toggleFullscreen()">Fullscreen Preview</button>
<button class="btn" onclick="loadSample()">Sample</button>
<span class="stats" id="stats">0 words | 0 lines | 0 chars</span>
</div>
<div class="main" id="main">
<div class="editor">
<div class="preview-header">Editor</div>
<textarea id="editor" placeholder="Type your markdown here..." oninput="renderMarkdown()"></textarea>
</div>
<div class="preview">
<div class="preview-header">Preview</div>
<div id="preview"></div>
</div>
</div>
<script>
const sample=`# MarkdownView

A **live** markdown *renderer*.

## Features

- Headings, **bold**, *italic*, ~~strikethrough~~
- Code blocks and \`inline code\`
- [Links](https://example.com)
- Ordered and unordered lists
- Tables, blockquotes, and horizontal rules

## Code Example

\`\`\`javascript
function hello() {
  console.log("Hello, World!");
}
\`\`\`

## Table

| Feature | Status |
|---------|--------|
| Bold | ✅ |
| Tables | ✅ |
| Code | ✅ |

## Blockquote

> "The best way to predict the future is to invent it." - Alan Kay

---

### Task List

- [x] Build markdown renderer
- [x] Add live preview
- [ ] Take over the world

![Sample Image](https://picsum.photos/400/200)
`;

const editor=document.getElementById('editor');
const previewEl=document.getElementById('preview');

function renderMarkdown(){
  let md=editor.value;
  let html=md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^```(\w*)\n([\s\S]*?)```$/gm,(m,lang,code)=>`<pre><code class="lang-${lang}">${code.trim()}</code></pre>`)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^######\s+(.+)$/gm,'<h6>$1</h6>')
    .replace(/^#####\s+(.+)$/gm,'<h5>$1</h5>')
    .replace(/^####\s+(.+)$/gm,'<h4>$1</h4>')
    .replace(/^###\s+(.+)$/gm,'<h3>$1</h3>')
    .replace(/^##\s+(.+)$/gm,'<h2>$1</h2>')
    .replace(/^#\s+(.+)$/gm,'<h1>$1</h1>')
    .replace(/^\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/~~(.+?)~~/g,'<del>$1</del>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>')
    .replace(/^>\s+(.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^---$/gm,'<hr>')
    .replace(/^\- \[x\]\s+(.+)$/gm,'<li class="task-list"><input type="checkbox" checked disabled> $1</li>')
    .replace(/^\- \[\]\s+(.+)$/gm,'<li class="task-list"><input type="checkbox" disabled> $1</li>')
    .replace(/^\s*[-*]\s+(.+)$/gm,'<li>$1</li>')
    .replace(/^\s*\d+\.\s+(.+)$/gm,'<li>$1</li>');

  // Wrap consecutive li tags in ul
  html=html.replace(/((?:<li(?:\s+class="task-list")?>.*?<\/li>\n?)+)/g,(m)=>'<ul>'+m+'</ul>');

  // Tables
  html=html.replace(/^(\|.+\|)\n(\|[-| :]+\|)\n((?:\|.+\|\n?)*)/gm,(m,header,sep,body)=>{
    const hCells=header.split('|').filter(c=>c.trim()).map(c=>`<th>${c.trim()}</th>`).join('');
    const rows=body.trim().split('\n').map(r=>{
      const cells=r.split('|').filter(c=>c.trim()).map(c=>`<td>${c.trim()}</td>`).join('');
      return`<tr>${cells}</tr>`;
    }).join('');
    return`<table><thead><tr>${hCells}</tr></thead><tbody>${rows}</tbody></table>`;
  });

  // Merge adjacent blockquotes
  html=html.replace(/<\/blockquote>\n<blockquote>/g,'\n');

  // Paragraphs - wrap remaining loose text
  html=html.split('\n\n').map(block=>{
    block=block.trim();
    if(!block)return'';
    if(/^<(h[1-6]|ul|ol|li|pre|blockquote|table|hr|img|div)/.test(block))return block;
    return`<p>${block}</p>`;
  }).join('\n');

  previewEl.innerHTML=html;

  // Stats
  const text=editor.value;
  const words=text.trim()?text.trim().split(/\s+/).length:0;
  const lines=text.split('\n').length;
  const chars=text.length;
  document.getElementById('stats').textContent=`${words} words | ${lines} lines | ${chars} chars`;
}

function loadSample(){editor.value=sample;renderMarkdown()}

function exportHTML(){
  const content=`<!DOCTYPE html>\n<html><head><meta charset="UTF-8"><title>Exported Markdown</title>\n<style>body{font-family:sans-serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.6;color:#333}\npre{background:#f5f5f5;padding:16px;border-radius:8px;overflow-x:auto}\ncode{background:#f5f5f5;padding:2px 4px;border-radius:3px}\nblockquote{border-left:4px solid #4449E2;padding:8px 16px;margin:12px 0;background:#f8f8ff}\ntable{border-collapse:collapse;width:100%}\nth,td{border:1px solid #ddd;padding:8px}\nth{background:#f5f5f5}\nimg{max-width:100%}</style></head>\n<body>\n${previewEl.innerHTML}\n</body></html>`;
  const blob=new Blob([content],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='markdown-export.html';a.click();
  URL.revokeObjectURL(url);
}

function toggleFullscreen(){document.getElementById('main').classList.toggle('fullscreen')}

editor.value=sample;renderMarkdown();
</script>
</body>
</html>
