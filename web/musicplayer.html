<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicPlayer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#23225A;color:#F0F0F5;height:100vh;display:flex;flex-direction:column}
a.back{position:fixed;top:12px;left:12px;color:#FFCB47;text-decoration:none;font-size:14px;opacity:.8;z-index:10}
a.back:hover{opacity:1}
.main{display:flex;flex:1;overflow:hidden;padding-top:0}
.sidebar{width:240px;background:#1a1a4a;border-right:1px solid #2E2F6E;display:flex;flex-direction:column;overflow:hidden}
.sidebar h2{padding:16px;color:#FFCB47;font-size:16px}
.sidebar .playlist-item{padding:10px 16px;cursor:pointer;font-size:13px;transition:.15s;border-bottom:1px solid rgba(240,240,245,.05)}
.sidebar .playlist-item:hover,.sidebar .playlist-item.active{background:#2E2F6E}
.sidebar .add-playlist{padding:10px 16px}
.center{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top-bar{display:flex;gap:8px;padding:12px 20px;background:#2E2F6E;align-items:center}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;background:#4449E2;color:#F0F0F5;transition:.2s}
.btn:hover{background:#5559F2}
.btn-accent{background:#FFCB47;color:#23225A}
.btn-sm{padding:3px 8px;font-size:11px}
input[type=text]{padding:6px 10px;border:1px solid rgba(240,240,245,.2);border-radius:6px;background:#1a1a4a;color:#F0F0F5;font-size:13px}
.song-list{flex:1;overflow-y:auto;padding:0 16px}
.song-row{display:flex;align-items:center;padding:8px;border-radius:6px;gap:10px;cursor:pointer;transition:.15s;font-size:13px}
.song-row:hover{background:rgba(68,73,226,.2)}
.song-row.playing{background:#4449E2}
.song-row .num{width:24px;text-align:right;color:rgba(240,240,245,.4);font-size:12px}
.song-row .info{flex:1;min-width:0}
.song-row .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-row .artist{font-size:11px;color:rgba(240,240,245,.5)}
.song-row .dur{color:rgba(240,240,245,.5);font-size:12px}
.song-row .fav{cursor:pointer;font-size:16px}
.player-bar{background:#2E2F6E;padding:12px 20px;border-top:1px solid rgba(240,240,245,.1)}
.now-playing{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.now-playing .art{width:40px;height:40px;border-radius:6px;background:#4449E2;display:flex;align-items:center;justify-content:center;font-size:20px}
.now-playing .np-info{flex:1}.now-playing .np-title{font-weight:600;font-size:14px}.now-playing .np-artist{font-size:12px;color:rgba(240,240,245,.5)}
.progress-row{display:flex;align-items:center;gap:8px}
.progress-row .time{font-size:11px;color:rgba(240,240,245,.5);min-width:40px}
.progress-bar{flex:1;height:4px;background:#1a1a4a;border-radius:2px;cursor:pointer;position:relative}
.progress-bar .fill{height:100%;background:#FFCB47;border-radius:2px;transition:width .3s}
.controls{display:flex;justify-content:center;gap:12px;margin-top:8px}
.ctrl-btn{background:none;border:none;color:#F0F0F5;cursor:pointer;font-size:18px;padding:4px;transition:.15s}
.ctrl-btn:hover{color:#FFCB47}
.ctrl-btn.active{color:#FFCB47}
.volume{display:flex;align-items:center;gap:6px;margin-left:auto}
.volume input[type=range]{width:80px;accent-color:#FFCB47}
</style>
</head>
<body>
<a href="../" class="back">&larr; Back</a>
<div class="main">
<div class="sidebar">
<h2>🎶 Playlists</h2>
<div id="playlistList"></div>
<div class="add-playlist"><input type="text" id="newPlaylistName" placeholder="New playlist..." style="width:100%" onkeydown="if(event.key==='Enter')addPlaylist()"></div>
</div>
<div class="center">
<div class="top-bar">
<input type="text" id="searchInput" placeholder="Search songs..." oninput="renderLibrary()">
<span style="flex:1"></span>
<span style="font-size:13px;color:rgba(240,240,245,.5)" id="songCount"></span>
</div>
<div class="song-list" id="songList"></div>
</div>
</div>
<div class="player-bar">
<div class="now-playing">
<div class="art" id="npArt">🎵</div>
<div class="np-info"><div class="np-title" id="npTitle">No song selected</div><div class="np-artist" id="npArtist">-</div></div>
</div>
<div class="progress-row">
<span class="time" id="currentTime">0:00</span>
<div class="progress-bar" onclick="seek(event)"><div class="fill" id="progressFill" style="width:0%"></div></div>
<span class="time" id="totalTime">0:00</span>
</div>
<div class="controls">
<button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()">🔀</button>
<button class="ctrl-btn" onclick="prevSong()">⏮</button>
<button class="ctrl-btn" id="playBtn" onclick="togglePlay()" style="font-size:24px">▶</button>
<button class="ctrl-btn" onclick="nextSong()">⏭</button>
<button class="ctrl-btn" id="repeatBtn" onclick="toggleRepeat()">🔁</button>
<div class="volume">🔊<input type="range" min="0" max="100" value="70" id="volumeSlider"></div>
</div>
</div>
<script>
const library=[
{title:"Midnight Drive",artist:"Neon Pulse",dur:234,genre:"Electronic"},
{title:"Sunset Boulevard",artist:"Luna Wave",dur:198,genre:"Pop"},
{title:"Thunder Road",artist:"Steel Storm",dur:267,genre:"Rock"},
{title:"Velvet Dreams",artist:"Silk Harmony",dur:212,genre:"R&B"},
{title:"Digital Rain",artist:"Neon Pulse",dur:245,genre:"Electronic"},
{title:"Heart of Gold",artist:"Amber Light",dur:189,genre:"Folk"},
{title:"Cosmic Journey",artist:"Stellar Drift",dur:301,genre:"Ambient"},
{title:"Street Lights",artist:"Urban Flow",dur:223,genre:"Hip-Hop"},
{title:"Crystal Waves",artist:"Ocean Sound",dur:256,genre:"Chill"},
{title:"Fire Dance",artist:"Steel Storm",dur:198,genre:"Rock"},
{title:"Starlight Serenade",artist:"Luna Wave",dur:278,genre:"Pop"},
{title:"Code & Coffee",artist:"Binary Beat",dur:204,genre:"Electronic"},
{title:"Autumn Leaves",artist:"Amber Light",dur:231,genre:"Folk"},
{title:"Neon Nights",artist:"Urban Flow",dur:215,genre:"Hip-Hop"},
{title:"Deep Blue",artist:"Ocean Sound",dur:289,genre:"Chill"},
{title:"Electric Soul",artist:"Silk Harmony",dur:243,genre:"R&B"},
{title:"Mountain Top",artist:"Wild Trail",dur:197,genre:"Folk"},
{title:"Pixel Heart",artist:"Binary Beat",dur:228,genre:"Electronic"},
{title:"Rainy Day Jazz",artist:"Smooth Cat",dur:312,genre:"Jazz"},
{title:"Storm Chaser",artist:"Steel Storm",dur:254,genre:"Rock"},
{title:"Gravity",artist:"Stellar Drift",dur:276,genre:"Ambient"},
{title:"Funky Town",artist:"Groove Machine",dur:203,genre:"Funk"},
{title:"Winter Solstice",artist:"Luna Wave",dur:267,genre:"Pop"},
{title:"Bass Drop",artist:"Neon Pulse",dur:187,genre:"Electronic"},
{title:"Whisper",artist:"Silk Harmony",dur:245,genre:"R&B"},
{title:"Road Trip",artist:"Wild Trail",dur:219,genre:"Folk"},
{title:"Neon Jungle",artist:"Urban Flow",dur:234,genre:"Hip-Hop"},
{title:"Moonbeam",artist:"Stellar Drift",dur:298,genre:"Ambient"},
{title:"Coffee Shop",artist:"Smooth Cat",dur:256,genre:"Jazz"},
{title:"Power Up",artist:"Binary Beat",dur:178,genre:"Electronic"}
];

let playlists=JSON.parse(localStorage.getItem('mp_playlists'))||[{name:'Favorites',songs:[]}];
let favs=JSON.parse(localStorage.getItem('mp_favs'))||[];
let currentPlaylist=0,playing=false,currentSongIdx=-1,queue=[],shuffle=false,repeat=0;
let elapsed=0,interval=null;

function save(){localStorage.setItem('mp_playlists',JSON.stringify(playlists));localStorage.setItem('mp_favs',JSON.stringify(favs))}

function addPlaylist(){
  const name=document.getElementById('newPlaylistName').value.trim();if(!name)return;
  playlists.push({name,songs:[]});document.getElementById('newPlaylistName').value='';save();renderPlaylists();
}

function selectPlaylist(i){currentPlaylist=i;renderPlaylists();renderLibrary()}

function renderPlaylists(){
  document.getElementById('playlistList').innerHTML=playlists.map((p,i)=>`<div class="playlist-item ${i===currentPlaylist?'active':''}" onclick="selectPlaylist(${i})">${esc(p.name)} <span style="color:rgba(240,240,245,.3);font-size:11px">${p.songs.length}</span></div>`).join('');
}

function renderLibrary(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  let songs=library.filter(s=>!q||s.title.toLowerCase().includes(q)||s.artist.toLowerCase().includes(q));
  document.getElementById('songCount').textContent=songs.length+' songs';
  document.getElementById('songList').innerHTML=songs.map((s,i)=>{
    const idx=library.indexOf(s);
    const isFav=favs.includes(idx);
    const playing=queue[queueIdx]===idx;
    return`<div class="song-row ${playing?'playing':''}" ondblclick="playSong(${idx})"><span class="num">${i+1}</span><div class="info"><div class="title">${esc(s.title)}</div><div class="artist">${esc(s.artist)}</div></div><span class="dur">${fmtTime(s.dur)}</span><span class="fav" onclick="event.stopPropagation();toggleFav(${idx})">${isFav?'❤️':'🤍'}</span><button class="btn btn-sm" onclick="event.stopPropagation();addToPlaylist(${idx})">+</button></div>`;
  }).join('');
}

function addToPlaylist(idx){playlists[currentPlaylist].songs.push(idx);save();renderPlaylists()}
function toggleFav(idx){const i=favs.indexOf(idx);if(i>=0)favs.splice(i,1);else favs.push(idx);save();renderLibrary()}

let queueIdx=0;
function playSong(idx){
  queue=playlists[currentPlaylist].songs.length?playlists[currentPlaylist].songs.map((_,i)=>playlists[currentPlaylist].songs[i]):library.map((_,i)=>i);
  queueIdx=queue.indexOf(idx);if(queueIdx<0){queue.push(idx);queueIdx=queue.length-1}
  playing=true;elapsed=0;document.getElementById('playBtn').textContent='⏸';
  updateNowPlaying();startProgress();
}

function updateNowPlaying(){
  if(queueIdx<0||queueIdx>=queue.length)return;
  const s=library[queue[queueIdx]];
  document.getElementById('npTitle').textContent=s.title;
  document.getElementById('npArtist').textContent=s.artist;
  document.getElementById('totalTime').textContent=fmtTime(s.dur);
  renderLibrary();
}

function togglePlay(){
  if(queueIdx<0)return;
  playing=!playing;document.getElementById('playBtn').textContent=playing?'⏸':'▶';
  if(playing)startProgress();else clearInterval(interval);
}

function nextSong(){
  if(!queue.length)return;
  if(shuffle)queueIdx=Math.floor(Math.random()*queue.length);
  else{queueIdx++;if(queueIdx>=queue.length)queueIdx=0}
  elapsed=0;playing=true;document.getElementById('playBtn').textContent='⏸';updateNowPlaying();startProgress();
}

function prevSong(){
  if(!queue.length)return;
  if(elapsed>3){elapsed=0;updateProgress();return}
  queueIdx--;if(queueIdx<0)queueIdx=queue.length-1;
  elapsed=0;playing=true;document.getElementById('playBtn').textContent='⏸';updateNowPlaying();startProgress();
}

function startProgress(){
  clearInterval(interval);
  interval=setInterval(()=>{
    if(!playing)return;
    elapsed++;
    const s=library[queue[queueIdx]];
    if(elapsed>=s.dur){
      if(repeat===1){elapsed=0}
      else if(repeat===2){nextSong();return}
      else{nextSong();if(queueIdx===0&&repeat===0){playing=false;document.getElementById('playBtn').textContent='▶'}}
    }
    updateProgress();
  },1000);
}

function updateProgress(){
  if(queueIdx<0||queueIdx>=queue.length)return;
  const s=library[queue[queueIdx]];
  const pct=(elapsed/s.dur)*100;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('currentTime').textContent=fmtTime(elapsed);
}

function seek(e){if(queueIdx<0)return;const r=e.currentTarget.getBoundingClientRect();const pct=(e.clientX-r.left)/r.width;const s=library[queue[queueIdx]];elapsed=Math.floor(pct*s.dur);updateProgress()}

function toggleShuffle(){shuffle=!shuffle;document.getElementById('shuffleBtn').classList.toggle('active',shuffle)}
function toggleRepeat(){repeat=(repeat+1)%3;document.getElementById('repeatBtn').classList.toggle('active',repeat>0);document.getElementById('repeatBtn').textContent=repeat===2?'🔂':'🔁'}

function fmtTime(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

renderPlaylists();renderLibrary();
</script>
</body>
</html>
