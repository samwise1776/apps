<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Focus Timer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#23225A;color:#F0F0F5;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
a.back{position:fixed;top:12px;left:12px;color:#FFCB47;text-decoration:none;font-size:14px;z-index:100;background:rgba(35,34,90,.9);padding:4px 10px;border-radius:6px}
a.back:hover{text-decoration:underline}
h1{color:#FFCB47;font-size:28px;margin-bottom:20px}
.timer-display{font-size:80px;font-weight:700;color:#FFCB47;margin:20px 0;font-variant-numeric:tabular-nums}
.timer-label{font-size:16px;color:#8888bb;margin-bottom:20px;text-transform:uppercase;letter-spacing:2px}
.controls{display:flex;gap:12px;margin-bottom:24px}
.btn{background:#4449E2;color:#F0F0F5;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600}
.btn:hover{background:#5555FF}
.btn.secondary{background:#2E2F5E;border:1px solid #4449E2}
.btn.danger{background:#e74c3c}
.btn:disabled{opacity:.4;cursor:not-allowed}
.settings{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;justify-content:center}
.setting{text-align:center}
.setting label{font-size:12px;color:#8888bb;display:block;margin-bottom:4px}
.setting input{background:#2E2F5E;color:#F0F0F5;border:1px solid #4449E2;border-radius:6px;padding:6px 10px;width:70px;text-align:center;font-size:14px}
.stats{display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.stat{background:#2E2F5E;border:1px solid #4449E2;border-radius:10px;padding:14px 20px;text-align:center}
.stat .val{font-size:22px;font-weight:700;color:#FFCB47}
.stat .lbl{font-size:11px;color:#8888bb;margin-top:2px}
.sessions{display:flex;gap:6px;justify-content:center;margin-bottom:20px}
.session-dot{width:12px;height:12px;border-radius:50%;background:#353670}
.session-dot.done{background:#2ecc71}
.session-dot.active{background:#FFCB47;box-shadow:0 0 8px #FFCB47}
.task-input{display:flex;gap:8px;margin-bottom:20px;width:100%;max-width:400px}
.task-input input{flex:1;background:#2E2F5E;color:#F0F0F5;border:1px solid #4449E2;border-radius:6px;padding:8px 12px;font-size:14px}
.log{max-width:400px;width:100%;margin-top:10px}
.log h3{color:#FFCB47;font-size:14px;margin-bottom:8px}
.log-item{background:#2E2F5E;border-radius:6px;padding:8px 12px;margin-bottom:4px;font-size:12px;display:flex;justify-content:space-between}
.log-item .type{color:#4449E2;font-weight:600}
.log-item .time{color:#8888bb}
</style>
</head>
<body>
<a href="../" class="back">&larr; Back</a>
<h1>Pomodoro Focus</h1>
<div class="sessions" id="sessions"></div>
<div class="timer-label" id="timerLabel">FOCUS</div>
<div class="timer-display" id="timerDisplay">25:00</div>
<div class="controls">
<button class="btn" id="startBtn" onclick="startTimer()">Start</button>
<button class="btn secondary" id="pauseBtn" onclick="pauseTimer()" disabled>Pause</button>
<button class="btn danger" id="resetBtn" onclick="resetTimer()">Reset</button>
<button class="btn secondary" onclick="skipTimer()">Skip</button>
</div>
<div class="settings">
<div class="setting"><label>Focus (min)</label><input id="focusMin" type="number" value="25" min="1" max="60" onchange="updateSettings()"></div>
<div class="setting"><label>Short Break</label><input id="shortBreak" type="number" value="5" min="1" max="30" onchange="updateSettings()"></div>
<div class="setting"><label>Long Break</label><input id="longBreak" type="number" value="15" min="1" max="60" onchange="updateSettings()"></div>
<div class="setting"><label>Sessions</label><input id="sessionsNeeded" type="number" value="4" min="1" max="10" onchange="updateSettings()"></div>
</div>
<div class="task-input"><input id="currentTask" placeholder="What are you working on?"></div>
<div class="stats" id="stats"></div>
<div class="log" id="log"></div>
<script>
const DB='pomo_data';
let mode='focus',running=false,timer=null,seconds=0;
let completedSessions=0,totalFocus=0,totalBreaks=0;
let focusSec=25*60,shortSec=5*60,longSec=15*60,sessionsNeeded=4;
let log=[];

function loadData(){try{const d=JSON.parse(localStorage.getItem(DB));if(d){completedSessions=d.cs||0;totalFocus=d.tf||0;totalBreaks=d.tb||0;log=d.log||[];focusSec=d.fs||25*60;shortSec=d.ss||5*60;longSec=d.ls||15*60;sessionsNeeded=d.sn||4;}}catch(e){}}
function saveData(){localStorage.setItem(DB,JSON.stringify({cs:completedSessions,tf:totalFocus,tb:totalBreaks,log,fs:focusSec,ss:shortSec,ls:longSec,sn:sessionsNeeded}))}

function updateSettings(){
    focusSec=(parseInt(document.getElementById('focusMin').value)||25)*60;
    shortSec=(parseInt(document.getElementById('shortBreak').value)||5)*60;
    longSec=(parseInt(document.getElementById('longBreak').value)||15)*60;
    sessionsNeeded=parseInt(document.getElementById('sessionsNeeded').value)||4;
    saveData();resetTimer();
}

function fmt(s){return Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0')}

function updateDisplay(){
    document.getElementById('timerDisplay').textContent=fmt(seconds);
    document.getElementById('timerLabel').textContent=mode==='focus'?'FOCUS':mode==='short'?'SHORT BREAK':'LONG BREAK';
    document.title=fmt(seconds)+' - Pomodoro';
    renderSessions();renderStats();
}

function renderSessions(){
    let html='';
    for(let i=0;i<sessionsNeeded;i++){
        const cls=i<completedSessions%sessionsNeeded?'done':i===completedSessions%sessionsNeeded?'active':'';
        html+='<div class="session-dot '+cls+'"></div>';
    }
    document.getElementById('sessions').innerHTML=html;
}

function renderStats(){
    document.getElementById('stats').innerHTML=
        '<div class="stat"><div class="val">'+completedSessions+'</div><div class="lbl">Sessions</div></div>'+
        '<div class="stat"><div class="val">'+Math.round(totalFocus/60)+'</div><div class="lbl">Focus min</div></div>'+
        '<div class="stat"><div class="val">'+Math.round(totalBreaks/60)+'</div><div class="lbl">Break min</div></div>';

    document.getElementById('log').innerHTML='<h3>Recent Sessions</h3>'+
        log.slice(-8).reverse().map(l=>
            '<div class="log-item"><span class="type">'+l.type+'</span><span>'+(l.task||'No task')+'</span><span class="time">'+l.time+'</span></div>'
        ).join('')||'<p style="color:#8888bb;font-size:12px">No sessions yet</p>';
}

function startTimer(){
    if(running)return;
    if(seconds===0){
        if(mode==='focus')seconds=focusSec;
        else if(mode==='short')seconds=shortSec;
        else seconds=longSec;
    }
    running=true;
    document.getElementById('startBtn').disabled=true;
    document.getElementById('pauseBtn').disabled=false;
    timer=setInterval(()=>{
        seconds--;
        if(seconds<=0){clearInterval(timer);running=false;onTimerEnd();}
        updateDisplay();
    },1000);
    updateDisplay();
}

function pauseTimer(){
    if(!running)return;
    clearInterval(timer);running=false;
    document.getElementById('startBtn').disabled=false;
    document.getElementById('pauseBtn').disabled=true;
}

function resetTimer(){
    clearInterval(timer);running=false;
    if(mode==='focus')seconds=focusSec;
    else if(mode==='short')seconds=shortSec;
    else seconds=longSec;
    document.getElementById('startBtn').disabled=false;
    document.getElementById('pauseBtn').disabled=true;
    updateDisplay();
}

function skipTimer(){
    clearInterval(timer);running=false;
    onTimerEnd();
}

function onTimerEnd(){
    const task=document.getElementById('currentTask').value.trim();
    const now=new Date().toLocaleTimeString();
    if(mode==='focus'){
        completedSessions++;totalFocus+=focusSec;
        log.push({type:'Focus',task,time:now});
        if(completedSessions%sessionsNeeded===0){mode='long';}
        else{mode='short';}
    } else {
        totalBreaks+=(mode==='short'?shortSec:longSec);
        log.push({type:'Break',task,time:now});
        mode='focus';
    }
    seconds=0;
    document.getElementById('startBtn').disabled=false;
    document.getElementById('pauseBtn').disabled=true;
    saveData();updateDisplay();
    try{new Audio('data:audio/wav;base64,UklGRl9vT19teleQBAABAAEAIlYAAESsAAABAAgA').play();}catch(e){}
}

loadData();
document.getElementById('focusMin').value=focusSec/60;
document.getElementById('shortBreak').value=shortSec/60;
document.getElementById('longBreak').value=longSec/60;
document.getElementById('sessionsNeeded').value=sessionsNeeded;
seconds=focusSec;updateDisplay();
</script>
</body>
</html>
