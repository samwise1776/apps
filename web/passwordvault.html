<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PasswordVault</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#23225A;color:#F0F0F5;min-height:100vh}
a.back{position:fixed;top:12px;left:12px;color:#FFCB47;text-decoration:none;font-size:14px;opacity:.8;z-index:10}
a.back:hover{opacity:1}
.container{max-width:800px;margin:0 auto;padding:40px 20px}
h1{font-size:28px;margin-bottom:24px;color:#FFCB47;text-align:center}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;background:#4449E2;color:#F0F0F5;transition:.2s}
.btn:hover{background:#5559F2}
.btn-accent{background:#FFCB47;color:#23225A}
.btn-danger{background:#e74c3c}
.btn-sm{padding:4px 10px;font-size:12px}
input{padding:8px 12px;border:1px solid rgba(240,240,245,.2);border-radius:6px;background:#1a1a4a;color:#F0F0F5;font-size:14px;width:100%}
input:focus{outline:none;border-color:#4449E2}
.section{background:#2E2F6E;border-radius:12px;padding:20px;margin-bottom:16px}
.section h3{color:#FFCB47;margin-bottom:12px;font-size:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid label{font-size:12px;color:rgba(240,240,245,.6);margin-bottom:4px;display:block}
.form-grid .full{grid-column:span 2}
.entry-card{background:#1a1a4a;border-radius:8px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.entry-card .site{font-weight:700;color:#FFCB47;min-width:120px}
.entry-card .user{color:rgba(240,240,245,.7);flex:1}
.entry-card .pw{font-family:monospace;letter-spacing:1px;min-width:100px}
.entry-card .pw.hidden{color:rgba(240,240,245,.3)}
.search-row{display:flex;gap:8px;margin-bottom:16px}
.strength{height:6px;border-radius:3px;margin-top:6px}
.strength span{display:block;height:100%;border-radius:3px;transition:width .3s}
.pw-gen-row{display:flex;gap:8px;align-items:end}
.pw-gen-row>div{flex:1;display:flex;flex-direction:column;gap:2px}
.pw-gen-row label{font-size:11px;color:rgba(240,240,245,.5)}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#2E2F6E;border-radius:16px;padding:28px;max-width:500px;width:90%}
.modal h2{margin-bottom:16px;color:#FFCB47}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#4449E2;color:#F0F0F5;padding:10px 24px;border-radius:8px;font-size:14px;opacity:0;transition:.3s;z-index:100}
.toast.show{opacity:1}
</style>
</head>
<body>
<a href="../" class="back">&larr; Back</a>
<div class="container">
<h1>🔐 PasswordVault</h1>
<div id="lockScreen" class="section" style="text-align:center">
<h3>Enter Master Password</h3>
<p style="margin-bottom:12px;font-size:13px;color:rgba(240,240,245,.6)">Your password is used to encrypt all stored data</p>
<input type="password" id="masterInput" placeholder="Master Password" style="max-width:300px;margin:0 auto 12px" onkeydown="if(event.key==='Enter')unlock()">
<button class="btn btn-accent" onclick="unlock()">Unlock</button>
</div>
<div id="app" style="display:none">
<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
<button class="btn btn-accent" onclick="showAdd()">+ Add Entry</button>
<button class="btn" onclick="showGen()">🔑 Generate Password</button>
<button class="btn" onclick="exportVault()">Export</button>
<button class="btn" onclick="importVault()">Import</button>
<button class="btn btn-danger" onclick="lock()">Lock</button>
</div>
<div class="search-row"><input type="text" id="searchInput" placeholder="Search entries..." oninput="renderEntries()"></div>
<div id="entries"></div>
</div>
</div>
<div class="modal-overlay" id="addModal">
<div class="modal">
<h2 id="modalTitle">Add Entry</h2>
<div class="form-grid">
<div><label>Site Name</label><input id="entrySite"></div>
<div><label>URL</label><input id="entryUrl"></div>
<div><label>Username</label><input id="entryUser"></div>
<div><label>Password</label><input id="entryPass" type="password"></div>
<div class="full"><label>Notes</label><input id="entryNotes"></div>
</div>
<button class="btn btn-accent" onclick="saveEntry()" style="margin-top:12px;width:100%">Save</button>
<button class="btn" onclick="hideAdd()" style="margin-top:8px;width:100%">Cancel</button>
</div>
</div>
<div class="modal-overlay" id="genModal">
<div class="modal">
<h2>Password Generator</h2>
<div class="pw-gen-row">
<div><label>Length</label><input type="number" id="genLen" value="16" min="4" max="128"></div>
<div><label><input type="checkbox" id="genUpper" checked> A-Z</label></div>
<div><label><input type="checkbox" id="genLower" checked> a-z</label></div>
<div><label><input type="checkbox" id="genNum" checked> 0-9</label></div>
<div><label><input type="checkbox" id="genSym" checked> !@#</label></div>
</div>
<button class="btn btn-accent" onclick="generatePw()" style="margin-top:12px;width:100%">Generate</button>
<div id="genResult" style="margin-top:12px;font-family:monospace;font-size:18px;text-align:center;padding:12px;background:#1a1a4a;border-radius:8px;word-break:break-all"></div>
<div class="strength" id="genStrength" style="margin-top:8px"><span></span></div>
<button class="btn" onclick="copyGenPw()" style="margin-top:8px;width:100%">Copy</button>
<button class="btn" onclick="hideGen()" style="margin-top:8px;width:100%">Close</button>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
let masterKey='',vault=[],editingIdx=-1,lockTimeout=null;

function xorEncrypt(text,key){let r='';for(let i=0;i<text.length;i++)r+=String.fromCharCode(text.charCodeAt(i)^key.charCodeAt(i%key.length));return btoa(r)}
function xorDecrypt(encoded,key){try{const text=atob(encoded);let r='';for(let i=0;i<text.length;i++)r+=String.fromCharCode(text.charCodeAt(i)^key.charCodeAt(i%key.length));return r}catch(e){return''}}

function unlock(){
  const pw=document.getElementById('masterInput').value;
  if(!pw)return;
  masterKey=pw;
  const stored=localStorage.getItem('pwVault');
  if(stored){try{vault=JSON.parse(xorDecrypt(stored,pw))}catch(e){alert('Wrong master password!');return}}
  document.getElementById('lockScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('masterInput').value='';
  renderEntries();resetLock();
}

function lock(){masterKey='';vault=[];document.getElementById('lockScreen').style.display='';document.getElementById('app').style.display='none';clearTimeout(lockTimeout)}

function resetLock(){clearTimeout(lockTimeout);lockTimeout=setTimeout(lock,5*60*1000)}
['click','keydown','mousemove'].forEach(e=>document.addEventListener(e,resetLock));

function saveVault(){localStorage.setItem('pwVault',xorEncrypt(JSON.stringify(vault),masterKey))}

function showAdd(idx){
  editingIdx=idx===undefined?-1:idx;
  document.getElementById('modalTitle').textContent=editingIdx>=0?'Edit Entry':'Add Entry';
  if(editingIdx>=0){const e=vault[editingIdx];document.getElementById('entrySite').value=e.site;document.getElementById('entryUrl').value=e.url;document.getElementById('entryUser').value=e.user;document.getElementById('entryPass').value=e.pass;document.getElementById('entryNotes').value=e.notes||''}
  else{['entrySite','entryUrl','entryUser','entryPass','entryNotes'].forEach(id=>document.getElementById(id).value='')}
  document.getElementById('addModal').classList.add('show');
}
function hideAdd(){document.getElementById('addModal').classList.remove('show')}
function showGen(){document.getElementById('genModal').classList.add('show')}
function hideGen(){document.getElementById('genModal').classList.remove('show')}

function saveEntry(){
  const entry={site:document.getElementById('entrySite').value,url:document.getElementById('entryUrl').value,user:document.getElementById('entryUser').value,pass:document.getElementById('entryPass').value,notes:document.getElementById('entryNotes').value};
  if(!entry.site){alert('Site name required');return}
  if(editingIdx>=0)vault[editingIdx]=entry;else vault.push(entry);
  saveVault();hideAdd();renderEntries();
}

function deleteEntry(i){if(confirm('Delete this entry?')){vault.splice(i,1);saveVault();renderEntries()}}

function renderEntries(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const filtered=vault.map((e,i)=>({...e,idx:i})).filter(e=>!q||e.site.toLowerCase().includes(q)||e.user.toLowerCase().includes(q));
  document.getElementById('entries').innerHTML=filtered.length?filtered.map(e=>`
    <div class="entry-card">
      <div class="site">${esc(e.site)}</div>
      <div class="user">${esc(e.user)}</div>
      <div class="pw hidden" id="pw-${e.idx}">${esc(e.pass)}</div>
      <button class="btn btn-sm" onclick="togglePw(${e.idx})">👁</button>
      <button class="btn btn-sm" onclick="copyPw(${e.idx})">📋</button>
      <button class="btn btn-sm" onclick="showAdd(${e.idx})">✏️</button>
      <button class="btn btn-sm btn-danger" onclick="deleteEntry(${e.idx})">×</button>
    </div>`).join(''):'<p style="color:rgba(240,240,245,.4);font-size:13px">No entries</p>';
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function togglePw(i){const el=document.getElementById('pw-'+i);el.classList.toggle('hidden')}
function copyPw(i){navigator.clipboard.writeText(vault[i].pass);showToast('Password copied')}

function generatePw(){
  const len=parseInt(document.getElementById('genLen').value)||16;
  let chars='';if(document.getElementById('genUpper').checked)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if(document.getElementById('genLower').checked)chars+='abcdefghijklmnopqrstuvwxyz';if(document.getElementById('genNum').checked)chars+='0123456789';if(document.getElementById('genSym').checked)chars+='!@#$%^&*()_+-=';
  if(!chars){chars='abcdefghijklmnopqrstuvwxyz'}
  let pw='';for(let i=0;i<len;i++)pw+=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('genResult').textContent=pw;
  const score=Math.min(4,Math.floor(len/4)+(document.getElementById('genUpper').checked?1:0)+(document.getElementById('genNum').checked?1:0)+(document.getElementById('genSym').checked?1:0));
  const colors=['#e74c3c','#e67e22','#f1c40f','#2ecc71','#4449E2'];
  const widths=['25%','50%','75%','100%'];
  const el=document.getElementById('genStrength');
  el.innerHTML=`<span style="width:${widths[Math.min(score,3)]};background:${colors[Math.min(score,4)]}"></span>`;
}
function copyGenPw(){const pw=document.getElementById('genResult').textContent;if(pw)navigator.clipboard.writeText(pw).then(()=>showToast('Copied'))}

function exportVault(){
  const blob=new Blob([JSON.stringify(vault,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vault-export.json';a.click();URL.revokeObjectURL(url);
}
function importVault(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=e=>{const r=new FileReader();r.onload=ev=>{try{vault=JSON.parse(ev.target.result);saveVault();renderEntries();showToast('Imported')}catch(e){alert('Invalid file')}};r.readAsText(e.target.files[0])};inp.click()}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
</script>
</body>
</html>
