<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorPal - Color Palette Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#23225A;color:#F0F0F5;min-height:100vh}
a.back{position:fixed;top:12px;left:12px;color:#FFCB47;text-decoration:none;font-size:14px;opacity:.8;z-index:10}
a.back:hover{opacity:1}
.container{max-width:900px;margin:0 auto;padding:40px 20px}
h1{text-align:center;font-size:28px;margin-bottom:24px;color:#FFCB47}
.palette{display:flex;gap:8px;margin-bottom:20px;height:260px}
.color-card{flex:1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;cursor:pointer;transition:.2s;position:relative;min-width:0}
.color-card:hover{transform:scale(1.03)}
.color-card .hex{font-size:14px;font-weight:700;text-align:center;background:rgba(0,0,0,.4);padding:6px;border-radius:6px}
.color-card .lock-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.4);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px}
.color-card .lock-btn.locked{background:#FFCB47;color:#23225A}
.color-card .picker{position:absolute;top:8px;left:8px;width:28px;height:28px;border:2px solid rgba(255,255,255,.5);border-radius:50%;cursor:pointer;background:none;padding:0}
.controls{display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;background:#4449E2;color:#F0F0F5;transition:.2s}
.btn:hover{background:#5559F2}
.btn-outline{background:transparent;border:1px solid #4449E2;color:#F0F0F5}
.btn-outline:hover{background:#4449E2}
.btn-accent{background:#FFCB47;color:#23225A}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#4449E2;color:#F0F0F5;padding:10px 24px;border-radius:8px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
.section{background:#2E2F6E;border-radius:12px;padding:20px;margin-bottom:16px}
.section h3{color:#FFCB47;margin-bottom:12px;font-size:16px}
.section-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.section-grid{grid-template-columns:1fr}.palette{flex-wrap:wrap;height:auto}.color-card{min-height:100px}}
select,input[type=number]{padding:8px 12px;border:1px solid rgba(240,240,245,.2);border-radius:6px;background:#23225A;color:#F0F0F5;font-size:14px}
.contrast-result{margin-top:12px;padding:12px;border-radius:8px;font-size:14px}
.history-palette{display:flex;gap:4px;height:40px;border-radius:8px;overflow:hidden;cursor:pointer;margin-bottom:8px;transition:.2s}
.history-palette:hover{transform:scale(1.02)}
.history-palette div{flex:1}
.export-preview{background:#23225A;border-radius:8px;padding:12px;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:150px;overflow-y:auto;margin-top:8px}
</style>
</head>
<body>
<a href="../" class="back">&larr; Back</a>
<div class="container">
<h1>🎨 ColorPal</h1>
<div class="palette" id="palette"></div>
<div class="controls">
<button class="btn" onclick="generatePalette()">Generate (Space)</button>
<button class="btn btn-outline" onclick="exportCSS()">CSS Variables</button>
<button class="btn btn-outline" onclick="exportJSON()">JSON</button>
<button class="btn btn-outline" onclick="exportImage()">Export Image</button>
<select id="harmonyMode" onchange="generatePalette()">
<option value="random">Random</option>
<option value="complementary">Complementary</option>
<option value="analogous">Analogous</option>
<option value="triadic">Triadic</option>
<option value="split">Split Complementary</option>
</select>
</div>
<div class="section-grid">
<div class="section">
<h3>Contrast Checker</h3>
<div style="display:flex;gap:8px;margin-bottom:8px">
<select id="fgColor" onchange="checkContrast()"></select>
<select id="bgColor" onchange="checkContrast()"></select>
</div>
<div class="contrast-result" id="contrastResult" style="background:#23225A;color:#F0F0F5;text-align:center">Sample Text - Select colors above</div>
<div style="margin-top:8px;font-size:13px" id="contrastRatio"></div>
</div>
<div class="section">
<h3>History</h3>
<div id="historyList"><p style="color:rgba(240,240,245,.4);font-size:13px">No palettes yet</p></div>
</div>
</div>
<canvas id="exportCanvas" style="display:none"></canvas>
</div>
<div class="toast" id="toast"></div>
<script>
let colors=['#4449E2','#FFCB47','#23225A','#2E2F6E','#F0F0F5'];
let locked=[false,false,false,false,false];
let history=JSON.parse(localStorage.getItem('palHistory'))||[];

function hexToHSL(hex){let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;let max=Math.max(r,g,b),min=Math.min(r,g,b),h,s,l=(max+min)/2;if(max===min){h=s=0}else{let d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break}}return[Math.round(h*360),Math.round(s*100),Math.round(l*100)]}

function hslToHex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(Math.min(k-3,9-k,1),-1)};const toHex=x=>Math.round(x*255).toString(16).padStart(2,'0');return`#${toHex(f(0))}${toHex(f(8))}${toToHex(f(4))}`}

function hslToHex2(h,s,l){s/=100;l/=100;let c=(1-Math.abs(2*l-1))*s;let x=c*(1-Math.abs((h/60)%2-1));let m=l-c/2;let r=0,g=0,b=0;if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}return`#${Math.round((r+m)*255).toString(16).padStart(2,'0')}${Math.round((g+m)*255).toString(16).padStart(2,'0')}${Math.round((b+m)*255).toString(16).padStart(2,'0')}`}

function randomHex(){return'#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0')}

function generatePalette(){
  const mode=document.getElementById('harmonyMode').value;
  const baseHue=Math.random()*360;const baseSat=50+Math.random()*40;const baseLit=40+Math.random()*30;
  let hues=[];
  if(mode==='complementary')hues=[baseHue,(baseHue+180)%360,baseHue,(baseHue+180)%360,baseHue];
  else if(mode==='analogous')hues=[baseHue-30,baseHue-15,baseHue,baseHue+15,baseHue+30].map(h=>((h%360)+360)%360);
  else if(mode==='triadic')hues=[baseHue,(baseHue+120)%360,(baseHue+240)%360,baseHue,(baseHue+120)%360];
  else if(mode==='split')hues=[baseHue,(baseHue+150)%360,(baseHue+210)%360,baseHue,(baseHue+150)%360];
  else hues=Array(5).fill(0).map(()=>Math.random()*360);
  for(let i=0;i<5;i++){if(!locked[i]){let s=baseSat+Math.random()*20-10;let l=baseLit+Math.random()*30-15;s=Math.max(20,Math.min(95,s));l=Math.max(15,Math.min(85,l));colors[i]=hslToHex2(hues[i]+Math.random()*20-10,s,l)}}
  render();
}

function render(){
  const el=document.getElementById('palette');
  el.innerHTML=colors.map((c,i)=>`<div class="color-card" style="background:${c}" onclick="copyHex('${c}')"><input type="color" class="picker" value="${c}" onclick="event.stopPropagation()" onchange="changeColor(${i},this.value)"><button class="lock-btn ${locked[i]?'locked':''}" onclick="event.stopPropagation();toggleLock(${i})">${locked[i]?'🔒':'🔓'}</button><div class="hex">${c.toUpperCase()}</div></div>`).join('');
  updateContrastSelects();
}

function changeColor(i,c){colors[i]=c;locked[i]=true;render()}
function toggleLock(i){locked[i]=!locked[i];render()}

function copyHex(hex){navigator.clipboard.writeText(hex);showToast('Copied '+hex.toUpperCase())}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}

function updateContrastSelects(){
  const fg=document.getElementById('fgColor'),bg=document.getElementById('bgColor');
  const fgv=fg.value,bgv=bg.value;
  fg.innerHTML=colors.map((c,i)=>`<option value="${c}" ${i===0?'selected':''}>${c}</option>`).join('');
  bg.innerHTML=colors.map((c,i)=>`<option value="${c}" ${i===4?'selected':''}>${c}</option>`).join('');
  if(fgv)fg.value=fgv;if(bgv)bg.value=bgv;
  fg.innerHTML+='<option value="#ffffff">White</option><option value="#000000">Black</option>';
  bg.innerHTML+='<option value="#ffffff">White</option><option value="#000000">Black</option>';
  checkContrast();
}

function luminance(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const toLinear=c=>c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);return 0.2126*toLinear(r)+0.7152*toLinear(g)+0.0722*toLinear(b)}

function contrastRatio(fg,bg){const l1=luminance(fg),l2=luminance(bg);const lighter=Math.max(l1,l2),darker=Math.min(l1,l2);return(lighter+0.05)/(darker+0.05)}

function checkContrast(){
  const fg=document.getElementById('fgColor').value;
  const bg=document.getElementById('bgColor').value;
  const ratio=contrastRatio(fg,bg);
  const el=document.getElementById('contrastResult');
  const info=document.getElementById('contrastRatio');
  el.style.background=bg;el.style.color=fg;el.textContent='Sample Text - Aa Bb Cc';
  const grade=ratio>=7?'AAA':ratio>=4.5?'AA':ratio>=3?'AA Large':'Fail';
  info.innerHTML=`Ratio: <strong>${ratio.toFixed(2)}:1</strong> - <strong>${grade}</strong>`;
}

function exportCSS(){
  const css=`:root {\n${colors.map((c,i)=>`  --color-${i+1}: ${c};`).join('\n')}\n}`;
  download('palette.css',css);showToast('CSS downloaded');
}

function exportJSON(){
  download('palette.json',JSON.stringify({colors,exported:new Date().toISOString()},null,2));showToast('JSON downloaded');
}

function exportImage(){
  const canvas=document.getElementById('exportCanvas');canvas.width=800;canvas.height=160;
  const ctx=canvas.getContext('2d');
  colors.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(i*160,0,160,160)});
  canvas.toBlob(blob=>{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='palette.png';a.click();URL.revokeObjectURL(url)});
  showToast('Image downloaded');
}

function download(name,content){const blob=new Blob([content],{type:'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}

function saveHistory(){history.unshift([...colors]);if(history.length>10)history.pop();localStorage.setItem('palHistory',JSON.stringify(history));renderHistory()}

function renderHistory(){
  const el=document.getElementById('historyList');
  if(!history.length){el.innerHTML='<p style="color:rgba(240,240,245,.4);font-size:13px">No palettes yet</p>';return}
  el.innerHTML=history.map((p,i)=>`<div class="history-palette" onclick="loadHistory(${i})">${p.map(c=>`<div style="background:${c}"></div>`).join('')}</div>`).join('');
}

function loadHistory(i){colors=[...history[i]];locked=[false,false,false,false,false];render()}

document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.matches('input,textarea,select')){e.preventDefault();generatePalette();saveHistory()}});

render();renderHistory();
</script>
</body>
</html>
