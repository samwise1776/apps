<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CanvasAlly - Drawing App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#23225A;color:#F0F0F5;font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
a.back{position:fixed;top:12px;left:12px;z-index:1000;color:#FFCB47;text-decoration:none;font-size:13px;background:rgba(46,47,94,.85);padding:4px 10px;border-radius:6px}
a.back:hover{background:rgba(68,73,226,.6)}
.toolbar{background:#2E2F5E;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid #4449E2;min-height:56px}
.tool-group{display:flex;align-items:center;gap:6px;padding:0 8px;border-right:1px solid rgba(240,240,245,.1)}
.tool-group:last-child{border-right:none}
.tool-btn{width:36px;height:36px;border:2px solid transparent;border-radius:8px;background:#23225A;color:#F0F0F5;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .15s}
.tool-btn:hover{border-color:#FFCB47}
.tool-btn.active{border-color:#FFCB47;background:#4449E2}
.tool-btn svg{width:20px;height:20px;fill:currentColor}
input[type=color]{width:36px;height:36px;border:2px solid #4449E2;border-radius:8px;cursor:pointer;background:transparent;padding:2px}
input[type=range]{width:80px;accent-color:#FFCB47;height:4px}
.label{font-size:11px;color:#aaa;white-space:nowrap}
.recent-colors{display:flex;gap:3px}
.swatch{width:22px;height:22px;border-radius:4px;border:2px solid transparent;cursor:pointer}
.swatch:hover{border-color:#FFCB47}
.btn{padding:6px 12px;border:none;border-radius:6px;background:#4449E2;color:#F0F0F5;cursor:pointer;font-size:12px;white-space:nowrap;transition:background .15s}
.btn:hover{background:#5a5ff0}
.btn.danger{background:#e24444}
.btn.danger:hover{background:#ff5555}
.checkbox-label{font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.checkbox-label input{accent-color:#FFCB47}
.canvas-wrapper{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:10px;background:#1a1a40}
canvas{background:#fff;cursor:crosshair;border-radius:4px;box-shadow:0 4px 24px rgba(0,0,0,.4)}
</style>
</head>
<body>
<a class="back" href="../">&larr; Back</a>
<div class="toolbar" id="toolbar">
  <div class="tool-group">
    <button class="tool-btn active" data-tool="brush" title="Brush">
      <svg viewBox="0 0 24 24"><path d="M20.71 4.04c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 2.12 2.12 1.83-1.83c.39-.38.39-1.02 0-1.41l-.71-.71zM3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
    </button>
    <button class="tool-btn" data-tool="eraser" title="Eraser">
      <svg viewBox="0 0 24 24"><path d="M16.24 3.56l4.95 4.94c.78.79.78 2.05 0 2.84L12 20.53a4.01 4.01 0 01-5.66 0L2.81 17c-.78-.78-.78-2.05 0-2.83l10.6-10.61c.79-.78 2.05-.78 2.83-.01zM4.22 15.58l3.54 3.53c.78.79 2.04.79 2.83 0l3.53-3.53-4.95-4.95-4.95 4.95z"/></svg>
    </button>
    <button class="tool-btn" data-tool="line" title="Line">
      <svg viewBox="0 0 24 24"><path d="M19 13L5 19" stroke="currentColor" stroke-width="2" fill="none"/></svg>
    </button>
    <button class="tool-btn" data-tool="rect" title="Rectangle">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button class="tool-btn" data-tool="circle" title="Circle">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button class="tool-btn" data-tool="fill" title="Fill">
      <svg viewBox="0 0 24 24"><path d="M16.56 8.94L8.32.7a1 1 0 00-1.42 0L5.18 2.42a1 1 0 000 1.41l2.12 2.12-4.24 4.24a2 2 0 000 2.83l5.65 5.66a2 2 0 002.83 0l5.02-5.03a2 2 0 000-2.83zM12 17.66l-5.66-5.66 8.49-8.49 5.66 5.66L12 17.66z"/><path d="M19 11.5s-2 2.17-2 3.5c0 1.1.9 2 2 2s2-.9 2-2c0-1.33-2-3.5-2-3.5z" fill="#FFCB47"/></svg>
    </button>
  </div>
  <div class="tool-group">
    <span class="label">Color</span>
    <input type="color" id="colorPicker" value="#000000">
    <div class="recent-colors" id="recentColors"></div>
  </div>
  <div class="tool-group">
    <span class="label">Size: <span id="sizeVal">4</span>px</span>
    <input type="range" id="brushSize" min="1" max="50" value="4">
  </div>
  <div class="tool-group">
    <span class="label">Opacity: <span id="opVal">100</span>%</span>
    <input type="range" id="opacity" min="10" max="100" value="100">
  </div>
  <div class="tool-group">
    <button class="btn" id="undoBtn" title="Undo">↩ Undo</button>
    <button class="btn" id="redoBtn" title="Redo">↪ Redo</button>
  </div>
  <div class="tool-group">
    <button class="btn danger" id="clearBtn">Clear</button>
  </div>
  <div class="tool-group">
    <label class="checkbox-label"><input type="checkbox" id="gridToggle"> Grid</label>
  </div>
  <div class="tool-group">
    <button class="btn" id="saveBtn">💾 Save PNG</button>
  </div>
  <div class="tool-group">
    <button class="btn" data-size="800x600">800×600</button>
    <button class="btn" data-size="1024x768">1024×768</button>
    <button class="btn" data-size="1920x1080">1920×1080</button>
  </div>
</div>
<div class="canvas-wrapper">
  <canvas id="canvas" width="800" height="600"></canvas>
</div>
<script>
const C = document.getElementById('canvas');
const ctx = C.getContext('2d');
ctx.fillStyle = '#fff'; ctx.fillRect(0,0,C.width,C.height);

let tool='brush', color='#000000', size=4, opacity=1, drawing=false, startX, startY;
let undoStack=[], redoStack=[], recentColors=[];
let gridOn=false, tempCanvas=null, tempCtx=null;

function saveState(){
  undoStack.push(C.toDataURL());
  if(undoStack.length>20) undoStack.shift();
  redoStack=[];
}
saveState();

function restoreState(dataUrl){
  const img=new Image();
  img.onload=()=>{ctx.clearRect(0,0,C.width,C.height);ctx.drawImage(img,0,0);};
  img.src=dataUrl;
}

document.querySelectorAll('.tool-btn[data-tool]').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tool-btn[data-tool]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); tool=b.dataset.tool;
    C.style.cursor=tool==='fill'?'crosshair':'crosshair';
  });
});

document.getElementById('colorPicker').addEventListener('input',e=>{color=e.target.value;addRecent(color);});
document.getElementById('brushSize').addEventListener('input',e=>{size=+e.target.value;document.getElementById('sizeVal').textContent=size;});
document.getElementById('opacity').addEventListener('input',e=>{opacity=+e.target.value/100;document.getElementById('opVal').textContent=Math.round(opacity*100);});

function addRecent(c){
  recentColors=recentColors.filter(x=>x!==c);
  recentColors.unshift(c);
  if(recentColors.length>8) recentColors.pop();
  renderRecent();
}
function renderRecent(){
  const el=document.getElementById('recentColors');
  el.innerHTML='';
  recentColors.forEach(c=>{
    const s=document.createElement('div');
    s.className='swatch'; s.style.background=c;
    s.onclick=()=>{color=c;document.getElementById('colorPicker').value=c;};
    el.appendChild(s);
  });
}

function drawGrid(){
  if(!gridOn)return;
  ctx.strokeStyle='rgba(200,200,200,0.3)'; ctx.lineWidth=1;
  for(let x=0;x<C.width;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,C.height);ctx.stroke();}
  for(let y=0;y<C.height;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(C.width,y);ctx.stroke();}
}

document.getElementById('gridToggle').addEventListener('change',e=>{
  gridOn=e.target.checked;
  if(!gridOn){restoreState(undoStack[undoStack.length-1]);}
});

function getPos(e){const r=C.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}

C.addEventListener('mousedown',e=>{
  drawing=true; const p=getPos(e); startX=p.x; startY=p.y;
  if(tool==='fill'){floodFill(Math.round(p.x),Math.round(p.y),color);saveState();drawing=false;return;}
  if(['line','rect','circle'].includes(tool)){
    tempCanvas=document.createElement('canvas');tempCanvas.width=C.width;tempCanvas.height=C.height;
    tempCtx=tempCanvas.getContext('2d');tempCtx.drawImage(C,0,0);
  }
  if(tool==='brush'||tool==='eraser'){
    ctx.globalAlpha=opacity;
    ctx.beginPath();ctx.moveTo(p.x,p.y);
  }
});
C.addEventListener('mousemove',e=>{
  if(!drawing)return;
  const p=getPos(e);
  if(tool==='brush'){
    ctx.strokeStyle=color;ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineTo(p.x,p.y);ctx.stroke();
  }else if(tool==='eraser'){
    ctx.globalAlpha=1;ctx.strokeStyle='#ffffff';ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineTo(p.x,p.y);ctx.stroke();ctx.globalAlpha=opacity;
  }else if(['line','rect','circle'].includes(tool)){
    ctx.clearRect(0,0,C.width,C.height);ctx.drawImage(tempCanvas,0,0);
    ctx.globalAlpha=opacity;ctx.strokeStyle=color;ctx.lineWidth=size;
    if(tool==='line'){ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(p.x,p.y);ctx.stroke();}
    if(tool==='rect'){ctx.strokeRect(startX,startY,p.x-startX,p.y-startY);}
    if(tool==='circle'){
      const rx=Math.abs(p.x-startX)/2,ry=Math.abs(p.y-startY)/2;
      ctx.beginPath();ctx.ellipse(startX+(p.x-startX)/2,startY+(p.y-startY)/2,rx,ry,0,0,Math.PI*2);ctx.stroke();
    }
  }
});
C.addEventListener('mouseup',()=>{if(drawing){drawing=false;ctx.globalAlpha=1;saveState();}});
C.addEventListener('mouseleave',()=>{if(drawing){drawing=false;ctx.globalAlpha=1;saveState();}});

function floodFill(sx,sy,fillColor){
  const imageData=ctx.getImageData(0,0,C.width,C.height);
  const data=imageData.data;
  const target=getPixel(data,sx,sy,C.width);
  if(target[0]===0&&target[1]===0&&target[2]===0&&target[3]===255)return;
  const fc=hexToRgb(fillColor);
  const stack=[[sx,sy]]; const visited=new Set();
  while(stack.length){
    const [x,y]=stack.pop();
    const key=y*C.width+x;
    if(visited.has(key)||x<0||x>=C.width||y<0||y>=C.height)continue;
    const p=getPixel(data,x,y,C.width);
    if(Math.abs(p[0]-target[0])>30||Math.abs(p[1]-target[1])>30||Math.abs(p[2]-target[2])>30)continue;
    visited.add(key);
    const idx=key*4;data[idx]=fc[0];data[idx+1]=fc[1];data[idx+2]=fc[2];data[idx+3]=255;
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ctx.putImageData(imageData,0,0);
}
function getPixel(d,x,y,w){const i=(y*w+x)*4;return[d[i],d[i+1],d[i+2],d[i+3]];}
function hexToRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return[r,g,b];}

document.getElementById('undoBtn').addEventListener('click',()=>{
  if(undoStack.length<=1)return;
  redoStack.push(undoStack.pop());
  restoreState(undoStack[undoStack.length-1]);
});
document.getElementById('redoBtn').addEventListener('click',()=>{
  if(!redoStack.length)return;
  const s=redoStack.pop();undoStack.push(s);restoreState(s);
});
document.getElementById('clearBtn').addEventListener('click',()=>{
  saveState();ctx.fillStyle='#fff';ctx.fillRect(0,0,C.width,C.height);saveState();
});
document.getElementById('saveBtn').addEventListener('click',()=>{
  const a=document.createElement('a');a.download='canvas.png';a.href=C.toDataURL('image/png');a.click();
});
document.querySelectorAll('[data-size]').forEach(b=>{
  b.addEventListener('click',()=>{
    const [w,h]=b.dataset.size.split('x').map(Number);
    C.width=w;C.height=h;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
    undoStack=[];redoStack=[];saveState();
  });
});
</script>
</body>
</html>
