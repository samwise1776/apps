<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaGPT - Language Model Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#23225A;--panel:#2E2F5E;--accent:#FFCB47;--text:#F0F0F5;--btn:#4449E2;--btn-hover:#5558f0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
a.back{position:absolute;top:10px;left:12px;color:var(--accent);text-decoration:none;font-size:13px;z-index:100;opacity:.8}.back:hover{opacity:1}
.top-bar{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 80px;background:var(--panel);border-bottom:1px solid rgba(255,255,255,.08)}
.top-bar h1{font-size:18px;font-weight:600}
.top-bar h1 span{color:var(--accent)}
.main{display:flex;flex:1;overflow:hidden}
.chat-panel{flex:1;display:flex;flex-direction:column}
.messages{flex:1;overflow-y:auto;padding:16px 16px 16px 80px}
.msg{display:flex;gap:10px;margin-bottom:16px;animation:fadeIn .3s}
.msg.user{flex-direction:row-reverse}
.msg .avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.msg.user .avatar{background:var(--btn)}
.msg.ai .avatar{background:var(--accent);color:#23225A}
.msg .bubble{max-width:70%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5}
.msg.user .bubble{background:var(--btn);border-bottom-right-radius:4px}
.msg.ai .bubble{background:rgba(255,255,255,.08);border-bottom-left-radius:4px}
.input-area{padding:12px 16px 12px 80px;background:var(--panel);border-top:1px solid rgba(255,255,255,.08);display:flex;gap:8px;align-items:flex-end}
.input-area textarea{flex:1;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:var(--text);font-size:13px;font-family:inherit;resize:none;height:42px;max-height:120px;line-height:1.4}
.input-area textarea::placeholder{color:rgba(240,240,245,.4)}
.input-area textarea:focus{outline:none;border-color:var(--btn)}
.btn{padding:6px 14px;border:none;border-radius:6px;background:var(--btn);color:#fff;font-size:13px;cursor:pointer;transition:.15s}
.btn:hover{background:var(--btn-hover)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-accent{background:var(--accent);color:#23225A}.btn-accent:hover{background:#ffe066}
.sidebar{width:260px;background:var(--panel);border-left:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;overflow-y:auto}
.sidebar .sb-section{padding:14px;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar .sb-title{font-size:11px;text-transform:uppercase;opacity:.4;font-weight:600;margin-bottom:10px}
.sidebar .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sidebar .info-item{background:rgba(0,0,0,.2);border-radius:6px;padding:8px;text-align:center}
.sidebar .info-item label{display:block;font-size:10px;opacity:.4;margin-bottom:2px}
.sidebar .info-item span{font-size:13px;font-weight:600}
.token-counter{font-size:13px;display:flex;justify-content:space-between;align-items:center}
.token-counter .count{color:var(--accent);font-weight:600}
.slider-row{display:flex;align-items:center;gap:8px;font-size:12px}
.slider-row input[type=range]{flex:1;accent-color:var(--accent)}
.slider-row .val{color:var(--accent);font-weight:600;min-width:30px}
.train-section{margin-top:4px}
.progress-bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:6px}
.progress-bar .fill{height:100%;background:var(--accent);border-radius:3px;width:0%;transition:width 2s linear}
.gen-section{margin-top:4px}
.gen-section textarea{width:100%;height:60px;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:var(--text);font-size:12px;font-family:inherit;resize:vertical;margin-bottom:6px}
.gen-output{background:rgba(0,0,0,.2);border-radius:6px;padding:8px;font-size:12px;line-height:1.5;max-height:100px;overflow-y:auto;white-space:pre-wrap}
.history-list{display:flex;flex-direction:column;gap:4px}
.history-item{padding:6px 8px;border-radius:6px;font-size:11px;cursor:pointer;background:rgba(255,255,255,.04);display:flex;gap:6px;align-items:center}
.history-item:hover{background:rgba(255,255,255,.08)}
.history-item .hi-icon{opacity:.4;font-size:12px}
.history-item .hi-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item .hi-time{opacity:.3;font-size:10px}
.typing{display:flex;gap:4px;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;bottom:20px;right:20px;background:var(--btn);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:300;animation:fadeIn .3s}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
</style>
</head>
<body>
<a href="../" class="back">&larr; Back</a>
<div class="top-bar">
<h1>Java<span>GPT</span></h1>
</div>
<div class="main">
<div class="chat-panel">
<div class="messages" id="messages"></div>
<div class="input-area">
<textarea id="userInput" placeholder="Type a message..." rows="1" onkeydown="handleKey(event)" oninput="updateTokenCount()"></textarea>
<button class="btn" onclick="sendMessage()">Send</button>
<button class="btn btn-accent btn-sm" onclick="trainOnInput()">Train</button>
</div>
</div>
<div class="sidebar">
<div class="sb-section">
<div class="sb-title">Model Info</div>
<div class="info-grid">
<div class="info-item"><label>Name</label><span>DataGPT-1</span></div>
<div class="info-item"><label>Parameters</label><span>~125M</span></div>
<div class="info-item"><label>Vocab</label><span>~50K</span></div>
<div class="info-item"><label>Layers</label><span>12</span></div>
<div class="info-item"><label>Heads</label><span>12</span></div>
<div class="info-item"><label>Type</label><span>Markov</span></div>
</div>
</div>
<div class="sb-section">
<div class="sb-title">Token Counter</div>
<div class="token-counter"><span>Input tokens</span><span class="count" id="tokenCount">0</span></div>
</div>
<div class="sb-section">
<div class="sb-title">Temperature</div>
<div class="slider-row">
<input type="range" id="tempSlider" min="0.1" max="2.0" step="0.1" value="0.8" oninput="document.getElementById('tempVal').textContent=this.value">
<span class="val" id="tempVal">0.8</span>
</div>
</div>
<div class="sb-section train-section">
<div class="sb-title">Training</div>
<button class="btn btn-sm" onclick="trainOnInput()" style="width:100%">Train on Input</button>
<div class="progress-bar"><div class="fill" id="trainFill"></div></div>
<div style="font-size:11px;opacity:.3;margin-top:4px" id="trainStatus">Ready</div>
</div>
<div class="sb-section gen-section">
<div class="sb-title">Generate Mode</div>
<textarea id="genInput" placeholder="Enter prompt for text generation..."></textarea>
<button class="btn btn-sm btn-accent" onclick="generateText()" style="width:100%">Generate 50-200 words</button>
<div class="gen-output" id="genOutput" style="display:none"></div>
</div>
<div class="sb-section">
<div class="sb-title">History</div>
<div class="history-list" id="historyList"></div>
</div>
</div>
</div>
<script>

let chain={};
let messages=[];
let history=[];
let isTraining=false;

function buildChain(text){const words=text.split(/\s+/);for(let i=0;i<words.length-1;i++){const w=words[i].toLowerCase();const n=words[i+1].toLowerCase();if(!chain[w])chain[w]=[];chain[w].push(words[i+1])}}

function initChain(){chain={};CORPUS.forEach(s=>buildChain(s))}

function generate(startWord,temp){
const maxLen=Math.floor(Math.random()*150)+50;
let result=[];
let word=startWord||CORPUS[Math.floor(Math.random()*CORPUS.length)].split(' ')[0].toLowerCase();
result.push(word);
for(let i=0;i<maxLen;i++){
const nexts=chain[word.toLowerCase()];
if(!nexts||!nexts.length)break;
const bucket=[];
const temps=parseFloat(document.getElementById('tempSlider').value)||0.8;
if(temps<=0.1){result.push(nexts[0]);word=nexts[0];continue}
const freq={};nexts.forEach(n=>{const k=n.toLowerCase();freq[k]=(freq[k]||0)+1});
const candidates=Object.entries(freq).sort((a,b)=>b[1]-a[1]);
const topN=Math.max(1,Math.ceil(candidates.length*temps/2));
const pool=candidates.slice(0,topN);
const totalW=pool.reduce((s,c)=>s+c[1],0);
let r=Math.random()*totalW;let chosen=pool[0][0];
for(const[c,w]of pool){r-=w;if(r<=0){chosen=c;break}}
const match=nexts.find(n=>n.toLowerCase()===chosen);
result.push(match||nexts[0]);
word=match||nexts[0];
}
return result.join(' ');
}

function generateFromPrompt(prompt,temp){
const words=prompt.split(/\s+/);
const lastWord=words[words.length-1].toLowerCase();
const generated=generate(lastWord,temp);
return prompt+' '+generated;
}

function load(){try{const d=localStorage.getItem(LS_KEY);if(d){const p=JSON.parse(d);messages=p.messages||[];history=p.history||[]}}catch(e){}}
function save(){localStorage.setItem(LS_KEY,JSON.stringify({messages,history}))}

load();
initChain();
messages.forEach(m=>addMsgToDOM(m.role,m.text,false));

function updateTokenCount(){const text=document.getElementById('userInput').value;const count=text.trim()?text.trim().split(/\s+/).length:0;document.getElementById('tokenCount').textContent=count}

function handleKey(e){
if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}
}

function sendMessage(){
const input=document.getElementById('userInput');
const text=input.value.trim();if(!text)return;
input.value='';updateTokenCount();
messages.push({role:'user',text});save();
addMsgToDOM('user',text,true);
input.style.height='42px';
setTimeout(()=>{
const temp=parseFloat(document.getElementById('tempSlider').value)||0.8;
const response=generateFromPrompt(text,temp);
messages.push({role:'ai',text:response});save();
addMsgToDOM('ai',response,true);
addHistory(text);
},500+Math.random()*1000);
}

function addMsgToDOM(role,text,scroll){
const el=document.getElementById('messages');
const avatar=role==='user'?'👤':'🤖';
const cls=role==='user'?'user':'ai';
const div=document.createElement('div');
div.className='msg '+cls;
div.innerHTML=`<div class="avatar">${avatar}</div><div class="bubble">${esc(text)}</div>`;
el.appendChild(div);
if(scroll)el.scrollTop=el.scrollHeight;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function addHistory(text){
history.unshift({text:text.slice(0,60)+(text.length>60?'...':''),time:new Date().toLocaleTimeString()});
if(history.length>20)history.pop();
save();renderHistory();
}

function renderHistory(){
const el=document.getElementById('historyList');
if(!history.length){el.innerHTML='<div style="font-size:12px;opacity:.3;padding:4px">No history yet</div>';return}
el.innerHTML=history.map(h=>`<div class="history-item" onclick="reusePrompt('${esc(h.text.replace(/'/g,"\\'"))}')">
<span class="hi-icon">💬</span>
<span class="hi-text">${esc(h.text)}</span>
<span class="hi-time">${h.time}</span>
</div>`).join('');
}

function reusePrompt(text){document.getElementById('userInput').value=text.replace(/\.\.\.$/,'');updateTokenCount();document.getElementById('userInput').focus()}

function trainOnInput(){
if(isTraining)return;
const input=document.getElementById('userInput').value.trim()||document.getElementById('genInput').value.trim();
if(!input){toast('Enter some text to train on');return}
isTraining=true;
document.getElementById('trainStatus').textContent='Training...';
const fill=document.getElementById('trainFill');
fill.style.transition='none';fill.style.width='0%';
setTimeout(()=>{fill.style.transition='width 2s linear';fill.style.width='100%'},50);
buildChain(input);
initChain();
CORPUS.push(input);
setTimeout(()=>{isTraining=false;document.getElementById('trainStatus').textContent='Complete - '+input.split(/\s+/).length+' tokens added';toast('Training complete')},2100);
}

function generateText(){
const prompt=document.getElementById('genInput').value.trim();if(!prompt){toast('Enter a prompt');return}
const temp=parseFloat(document.getElementById('tempSlider').value)||0.8;
const result=generateFromPrompt(prompt,temp);
const out=document.getElementById('genOutput');
out.style.display='block';
out.textContent=result;
history.unshift({text:'Gen: '+prompt.slice(0,50),time:new Date().toLocaleTimeString()});
if(history.length>20)history.pop();save();renderHistory();
}

renderHistory();
</script>
</body>
</html>
