<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataLaunch - App Launcher</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#23225A;--panel:#2E2F5E;--accent:#FFCB47;--text:#F0F0F5;--btn:#4449E2;--btn-hover:#5558f0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a.back{position:fixed;top:10px;left:12px;color:var(--accent);text-decoration:none;font-size:13px;z-index:100;opacity:.8}.back:hover{opacity:1}
.top-bar{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 80px;background:var(--panel);border-bottom:1px solid rgba(255,255,255,.08)}
.top-bar h1{font-size:18px;font-weight:600;margin-right:16px}
.top-bar input[type=text]{flex:1;max-width:300px;padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:var(--text);font-size:13px}
.top-bar input::placeholder{color:rgba(240,240,245,.4)}
.stats-bar{display:flex;gap:16px;padding:12px 16px 12px 80px;background:rgba(0,0,0,.15);font-size:13px}
.stats-bar .stat{display:flex;align-items:center;gap:6px}
.stats-bar .stat-num{font-size:20px;font-weight:700;color:var(--accent)}
.btn{padding:6px 14px;border:none;border-radius:6px;background:var(--btn);color:#fff;font-size:13px;cursor:pointer;transition:.15s}
.btn:hover{background:var(--btn-hover)}
.btn-sm{padding:4px 10px;font-size:12px}
.filter-bar{display:flex;gap:6px;padding:8px 16px 8px 80px;flex-wrap:wrap}
.filter-bar .pill{padding:5px 14px;border-radius:20px;font-size:12px;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid transparent;transition:.15s}
.filter-bar .pill.active{background:var(--btn);border-color:var(--btn)}
.filter-bar .pill:hover{background:rgba(255,255,255,.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:16px 16px 16px 80px}
.card{background:var(--panel);border-radius:10px;padding:20px;cursor:pointer;border:2px solid transparent;transition:.2s}
.card:hover{border-color:rgba(255,255,255,.15);transform:translateY(-2px)}
.card .card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card .app-icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px}
.card .badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.badge-active{background:rgba(46,204,113,.2);color:#2ecc71}
.badge-development{background:rgba(52,152,219,.2);color:#3498db}
.badge-unfinished{background:rgba(243,156,18,.2);color:#f39c12}
.badge-retired{background:rgba(149,165,166,.2);color:#95a5a6}
.card .app-name{font-size:15px;font-weight:600;margin-bottom:4px}
.card .app-version{font-size:12px;opacity:.5;margin-bottom:8px}
.card .app-desc{font-size:12px;opacity:.6;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--panel);border-radius:12px;padding:28px;width:480px;max-width:90vw;max-height:90vh;overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:4px}
.modal .modal-version{font-size:13px;opacity:.5;margin-bottom:16px}
.modal .modal-desc{font-size:13px;line-height:1.6;opacity:.8;margin-bottom:16px}
.modal .modal-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.modal .info-item{background:rgba(0,0,0,.2);border-radius:8px;padding:10px 14px}
.modal .info-item label{font-size:11px;opacity:.4;display:block;margin-bottom:2px}
.modal .info-item span{font-size:14px;font-weight:600}
.modal .modal-actions{display:flex;gap:8px;margin-top:12px}
.modal .close-btn{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;opacity:.5}
.modal .close-btn:hover{opacity:1}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;background:#2ecc71;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:300;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.empty{padding:60px;text-align:center;opacity:.3;font-size:14px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
</style>
</head>
<body>
<a href="../" class="back">&larr; Back</a>
<div class="top-bar">
<h1>DataLaunch</h1>
<input type="text" id="searchInput" placeholder="Search apps...">
</div>
<div class="stats-bar">
<div class="stat"><span class="stat-num" id="totalApps">0</span> Total Apps</div>
<div class="stat"><span class="stat-num" id="activeCount">0</span> Active</div>
<div class="stat"><span class="stat-num" id="devCount">0</span> In Dev</div>
</div>
<div class="filter-bar" id="filterBar"></div>
<div class="grid" id="appGrid"></div>
<div class="modal-overlay" id="modal"><div class="modal" id="modalContent"></div></div>
<script>
const LS_KEY='datalaunch_data';
const STATUS_COLORS={Active:'badge-active',Development:'badge-development',Unfinished:'badge-unfinished',Retired:'badge-retired'};
const ICONS=['🚀','📊','🔧','🌐','📡','🛡️','⚡','📦','🎨','🔍','💡','🧩','📋','🗂️','🔐'];

let apps=[
{id:'da-1',name:'DataCenter Hub',version:'3.2.1',status:'Active',desc:'Central management dashboard for all Datacenter operations and monitoring.',buildDate:'2026-06-01',repoSize:'245 MB',testStatus:'All Passing',icon:'🚀'},
{id:'da-2',name:'CloudSync',version:'2.8.0',status:'Active',desc:'Real-time cloud synchronization service with conflict resolution and versioning.',buildDate:'2026-05-15',repoSize:'180 MB',testStatus:'All Passing',icon:'☁️'},
{id:'da-3',name:'NetProbe',version:'1.5.3',status:'Active',desc:'Network diagnostic and monitoring tool with latency tracking and packet analysis.',buildDate:'2026-04-20',repoSize:'95 MB',testStatus:'98% Passing',icon:'📡'},
{id:'da-4',name:'VaultGuard',version:'2.1.0',status:'Active',desc:'Encrypted secrets management with rotation policies and audit logging.',buildDate:'2026-03-10',repoSize:'120 MB',testStatus:'All Passing',icon:'🛡️'},
{id:'da-5',name:'LogStream',version:'1.0.4',status:'Development',desc:'Distributed log aggregation and analysis platform with real-time streaming.',buildDate:'2026-06-10',repoSize:'310 MB',testStatus:'85% Passing',icon:'📋'},
{id:'da-6',name:'MetricVault',version:'0.9.2',status:'Development',desc:'Time-series metrics storage with custom dashboard and alerting capabilities.',buildDate:'2026-05-28',repoSize:'200 MB',testStatus:'72% Passing',icon:'📊'},
{id:'da-7',name:'DeployBot',version:'0.7.1',status:'Development',desc:'Automated deployment pipeline with rollback support and canary releases.',buildDate:'2026-06-14',repoSize:'155 MB',testStatus:'60% Passing',icon:'🤖'},
{id:'da-8',name:'CacheForge',version:'0.5.0',status:'Unfinished',desc:'Distributed caching layer with consistent hashing and eviction policies.',buildDate:'2026-06-18',repoSize:'88 MB',testStatus:'45% Passing',icon:'⚡'},
{id:'da-9',name:'ConfigHub',version:'0.3.2',status:'Unfinished',desc:'Centralized configuration management with versioning and hot-reload support.',buildDate:'2026-06-12',repoSize:'65 MB',testStatus:'30% Passing',icon:'🔧'},
{id:'da-10',name:'TaskRunner',version:'0.2.0',status:'Unfinished',desc:'Scheduled task orchestration with dependency graphs and failure recovery.',buildDate:'2026-06-08',repoSize:'72 MB',testStatus:'20% Passing',icon:'⚙️'},
{id:'da-11',name:'WebMonitor',version:'4.0.0',status:'Retired',desc:'Legacy web endpoint monitoring service. Replaced by NetProbe v2.',buildDate:'2025-11-01',repoSize:'145 MB',testStatus:'Deprecated',icon:'🌐'},
{id:'da-12',name:'BackupMaster',version:'3.5.2',status:'Retired',desc:'Legacy backup orchestration tool. Replaced by DataVault.',buildDate:'2025-09-15',repoSize:'190 MB',testStatus:'Deprecated',icon:'📦'},
{id:'da-13',name:'AuthGateway',version:'1.2.0',status:'Active',desc:'OAuth2/OpenID authentication gateway with SSO federation support.',buildDate:'2026-05-01',repoSize:'110 MB',testStatus:'All Passing',icon:'🔐'},
{id:'da-14',name:'DataForge',version:'0.8.0',status:'Development',desc:'ETL pipeline builder with visual workflow editor and data transformation.',buildDate:'2026-06-05',repoSize:'275 MB',testStatus:'78% Passing',icon:'🗂️'},
{id:'da-15',name:'InsightAI',version:'0.1.0',status:'Unfinished',desc:'AI-powered analytics engine for anomaly detection and predictive scaling.',buildDate:'2026-06-20',repoSize:'420 MB',testStatus:'15% Passing',icon:'🧩'},
];

let filter='All';
let search='';

function load(){try{const d=localStorage.getItem(LS_KEY);if(d){const p=JSON.parse(d);if(p.apps)apps=p.apps}}catch(e){}}
function save(){localStorage.setItem(LS_KEY,JSON.stringify({apps}))}
load();

function renderStats(){
const total=apps.length;
document.getElementById('totalApps').textContent=total;
document.getElementById('activeCount').textContent=apps.filter(a=>a.status==='Active').length;
document.getElementById('devCount').textContent=apps.filter(a=>a.status==='Development').length;
}

function renderFilterBar(){
const statuses=['All','Active','Development','Unfinished','Retired'];
document.getElementById('filterBar').innerHTML=statuses.map(s=>
`<span class="pill ${filter===s?'active':''}" onclick="setFilter('${s}')">${s}</span>`
).join('');
}

function setFilter(f){filter=f;renderFilterBar();renderGrid()}

function renderGrid(){
let filtered=[...apps];
if(filter!=='All')filtered=filtered.filter(a=>a.status===filter);
if(search){const s=search.toLowerCase();filtered=filtered.filter(a=>a.name.toLowerCase().includes(s)||a.desc.toLowerCase().includes(s))}
const grid=document.getElementById('appGrid');
if(!filtered.length){grid.innerHTML='<div class="empty">No apps found</div>';return}
grid.innerHTML=filtered.map(a=>`<div class="card" onclick="openModal('${a.id}')">
<div class="card-header">
<div class="app-icon" style="background:rgba(255,255,255,.08)">${a.icon||'📦'}</div>
<span class="badge ${STATUS_COLORS[a.status]||''}">${a.status}</span>
</div>
<div class="app-name">${esc(a.name)}</div>
<div class="app-version">v${a.version}</div>
<div class="app-desc">${esc(a.desc)}</div>
</div>`).join('');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function openModal(id){
const a=apps.find(x=>x.id===id);if(!a)return;
const m=document.getElementById('modalContent');
m.style.position='relative';
m.innerHTML=`<button class="close-btn" onclick="closeModal()">&times;</button>
<h2>${a.icon||'📦'} ${esc(a.name)}</h2>
<div class="modal-version">Version ${a.version} &bull; ${a.status}</div>
<div class="modal-desc">${esc(a.desc)}</div>
<div class="modal-info">
<div class="info-item"><label>Status</label><span class="${STATUS_COLORS[a.status]||''}" style="font-size:13px">${a.status}</span></div>
<div class="info-item"><label>Build Date</label><span style="font-size:13px">${a.buildDate}</span></div>
<div class="info-item"><label>Repo Size</label><span style="font-size:13px">${a.repoSize}</span></div>
<div class="info-item"><label>Tests</label><span style="font-size:13px">${a.testStatus}</span></div>
</div>
<div class="modal-actions">
<button class="btn" id="buildBtn" onclick="doBuild('${a.id}')">🔨 Build</button>
<button class="btn" id="releaseBtn" onclick="doRelease('${a.id}')" style="background:var(--accent);color:#23225A">🚀 Release</button>
</div>`;
document.getElementById('modal').classList.add('open');
}

function closeModal(){document.getElementById('modal').classList.remove('open')}

document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});

function doBuild(id){
const btn=document.getElementById('buildBtn');
btn.innerHTML='<span class="spinner"></span> Building...';btn.disabled=true;
setTimeout(()=>{btn.innerHTML='✅ Build Complete';btn.disabled=false;toast('Build complete for '+apps.find(a=>a.id===id).name)},2000);
}

function doRelease(id){
const btn=document.getElementById('releaseBtn');
btn.innerHTML='<span class="spinner"></span> Releasing...';btn.disabled=true;
setTimeout(()=>{btn.innerHTML='✅ Released';btn.disabled=false;toast('Released '+apps.find(a=>a.id===id).name+' v'+apps.find(a=>a.id===id).version)},2000);
}

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}

document.getElementById('searchInput').addEventListener('input',e=>{search=e.target.value;renderGrid()});

renderStats();renderFilterBar();renderGrid();
</script>
</body>
</html>
